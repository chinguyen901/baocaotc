
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn thi Phân tích BCTC - 200 câu</title>
<style>
:root {
  --bg:#f3f5f9;--panel:#fff;--nav:#142238;--primary:#2563eb;
  --text:#182235;--muted:#64748b;--border:#e2e8f0;
  --green:#15803d;--red:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font-family:Arial,sans-serif}
header{background:var(--nav);color:white;padding:22px 5%;
display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
header h1{font-size:21px;margin:0 0 6px}
header p{margin:0;color:#cbd5e1;font-size:13px}
.container{max-width:1150px;margin:24px auto;padding:0 16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat,.panel,.question{background:white;border:1px solid var(--border);
border-radius:12px;padding:17px}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:25px;margin-top:7px}
.layout{display:grid;grid-template-columns:250px 1fr;gap:18px}
.sidebar{height:max-content}
.sidebar button,.action{width:100%;border:0;border-radius:8px;padding:11px;
margin:4px 0;text-align:left;background:#f1f5f9;color:var(--text);
cursor:pointer;font-size:14px}
.sidebar button.active,.action.primary{background:var(--primary);color:white}
.action{width:auto;text-align:center;padding:10px 15px}
select,input{padding:10px;border:1px solid var(--border);border-radius:8px;
background:white;color:var(--text)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.question{margin-bottom:14px}
.qtop{display:flex;justify-content:space-between;gap:10px;color:var(--muted);
font-size:12px;margin-bottom:13px}
.qtext{font-weight:600;line-height:1.6;margin-bottom:15px}
.option{display:block;width:100%;text-align:left;padding:12px;
border:1px solid var(--border);border-radius:8px;background:white;
margin:8px 0;cursor:pointer;line-height:1.5}
.option:hover{border-color:var(--primary);background:#eff6ff}
.option.correct{border-color:var(--green);background:#f0fdf4}
.option.wrong{border-color:var(--red);background:#fef2f2}
.explain{display:none;background:#f8fafc;border-left:4px solid var(--primary);
padding:13px;margin-top:13px;border-radius:5px;line-height:1.6;font-size:14px}
.explain.show{display:block}
.tag{font-size:11px;background:#eaf1ff;color:#1d4ed8;
padding:5px 8px;border-radius:20px}
.progress{height:8px;background:#e2e8f0;border-radius:20px;overflow:hidden}
.progress div{height:100%;background:var(--primary);width:0}
#questionArea{min-height:300px}
.hidden{display:none!important}
.footer{color:var(--muted);font-size:12px;text-align:center;margin:25px}
@media(max-width:750px){
 .layout{grid-template-columns:1fr}
 .stats{grid-template-columns:repeat(2,1fr)}
 .sidebar{display:grid;grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header>
 <div>
  <h1>LUYỆN THI PHÂN TÍCH BÁO CÁO TÀI CHÍNH</h1>
  <p>Ôn tập chứng chỉ chuyên môn chứng khoán – UBCKNN</p>
 </div>
 <div>NGÂN HÀNG CÂU HỎI 200 CÂU</div>
</header>

<div class="container">
 <div class="stats">
  <div class="stat"><small>Tổng số câu hiện có</small><strong id="total">0</strong></div>
  <div class="stat"><small>Đã làm</small><strong id="done">0</strong></div>
  <div class="stat"><small>Trả lời đúng</small><strong id="right">0</strong></div>
  <div class="stat"><small>Tỷ lệ chính xác</small><strong id="rate">0%</strong></div>
 </div>

 <div class="panel" style="margin-bottom:18px">
  <div style="display:flex;justify-content:space-between;margin-bottom:9px">
   <b>Tiến độ ôn tập</b><span id="progressText">0%</span>
  </div>
  <div class="progress"><div id="progressBar"></div></div>
 </div>

 <div class="layout">
  <aside class="panel sidebar">
   <b>CHẾ ĐỘ HỌC</b>
   <button class="active" onclick="setMode('all',this)">Tất cả câu hỏi</button>
   <button onclick="setMode('unanswered',this)">Câu chưa làm</button>
   <button onclick="setMode('wrong',this)">Câu trả lời sai</button>
   <button onclick="setMode('bookmarked',this)">Câu đã đánh dấu</button>
   <button onclick="startExam()">Thi thử 50 câu</button>
   <button onclick="resetProgress()">Xóa tiến độ</button>
   <hr style="border:0;border-top:1px solid var(--border);margin:13px 0">
   <b>CHUYÊN ĐỀ</b>
   <div id="topicList"></div>
  </aside>

  <main>
   <div class="toolbar">
    <input id="search" placeholder="Tìm nội dung câu hỏi..." oninput="render()">
    <select id="sort" onchange="render()">
     <option value="normal">Thứ tự câu hỏi</option>
     <option value="random">Ngẫu nhiên</option>
    </select>
   </div>
   <div id="examInfo" class="panel hidden" style="margin-bottom:12px"></div>
   <div id="questionArea"></div>
   <div style="display:flex;justify-content:space-between;gap:10px">
    <button class="action" onclick="previousQuestion()">← Câu trước</button>
    <button class="action primary" onclick="nextQuestion()">Câu tiếp theo →</button>
   </div>
  </main>
 </div>
 <div class="footer">
  Tài liệu ôn tập tham khảo, không phải đề thi chính thức của UBCKNN.
 </div>
</div>

<script>
const questions = [
// =====================================================
// 60 BÀI TẬP THỰC TẾ - PHÂN TÍCH BÁO CÁO TÀI CHÍNH
// Cấu trúc tương thích: q, a, c, e
// c = vị trí đáp án đúng, bắt đầu từ 0
// =====================================================

{
  q: "Bài 1. Doanh nghiệp A có tài sản ngắn hạn 600 tỷ đồng và nợ ngắn hạn 400 tỷ đồng. Hệ số thanh toán hiện hành là bao nhiêu?",
  a: ["0,67 lần", "1,5 lần", "2 lần", "2,5 lần"],
  c: 1,
  e: "Công thức: Hệ số thanh toán hiện hành = Tài sản ngắn hạn / Nợ ngắn hạn. Thay số: 600 / 400 = 1,5 lần. Nghĩa là cứ 1 đồng nợ ngắn hạn, doanh nghiệp có 1,5 đồng tài sản ngắn hạn để đảm bảo. Chỉ tiêu cao thường thể hiện khả năng thanh toán ngắn hạn tốt hơn, nhưng cần xem xét chất lượng hàng tồn kho và khoản phải thu."
},
{
  q: "Bài 2. Doanh nghiệp B có tài sản ngắn hạn 500 tỷ, hàng tồn kho 200 tỷ và nợ ngắn hạn 400 tỷ. Hệ số thanh toán nhanh là bao nhiêu? Giả sử không có tài sản ngắn hạn kém thanh khoản nào khác cần loại trừ.",
  a: ["0,5 lần", "0,75 lần", "1 lần", "1,25 lần"],
  c: 1,
  e: "Công thức đơn giản: Hệ số thanh toán nhanh = (Tài sản ngắn hạn - Hàng tồn kho) / Nợ ngắn hạn. Thay số: (500 - 200) / 400 = 0,75 lần. Chỉ tiêu này loại trừ hàng tồn kho do hàng tồn kho thường cần thời gian để bán và chuyển thành tiền. Hệ số dưới 1 cho thấy tài sản có tính thanh khoản cao chưa đủ bù đắp toàn bộ nợ ngắn hạn."
},
{
  q: "Bài 3. Tổng tài sản của doanh nghiệp là 2.000 tỷ đồng, trong đó tài sản ngắn hạn là 600 tỷ đồng. Tỷ trọng tài sản ngắn hạn trong tổng tài sản là bao nhiêu?",
  a: ["20%", "25%", "30%", "35%"],
  c: 2,
  e: "Tỷ trọng tài sản ngắn hạn = Tài sản ngắn hạn / Tổng tài sản × 100%. Thay số: 600 / 2.000 × 100% = 30%. Điều này cho thấy 30% tài sản của doanh nghiệp nằm ở nhóm tài sản ngắn hạn; 70% còn lại là tài sản dài hạn. Cần so sánh với đặc điểm ngành nghề để đánh giá cơ cấu này có hợp lý hay không."
},
{
  q: "Bài 4. Doanh nghiệp có nợ phải trả 900 tỷ đồng và tổng nguồn vốn 1.500 tỷ đồng. Tỷ trọng nợ phải trả là bao nhiêu?",
  a: ["40%", "50%", "60%", "70%"],
  c: 2,
  e: "Tỷ trọng nợ phải trả = Nợ phải trả / Tổng nguồn vốn × 100%. Thay số: 900 / 1.500 × 100% = 60%. Doanh nghiệp tài trợ 60% tổng nguồn vốn bằng nợ và 40% bằng vốn chủ sở hữu. Tỷ lệ nợ cao làm tăng áp lực trả lãi, trả gốc và rủi ro tài chính."
},
{
  q: "Bài 5. Doanh nghiệp có tài sản ngắn hạn 500 tỷ đồng và nợ ngắn hạn 300 tỷ đồng. Vốn lưu động ròng là bao nhiêu?",
  a: ["100 tỷ đồng", "150 tỷ đồng", "200 tỷ đồng", "250 tỷ đồng"],
  c: 2,
  e: "Vốn lưu động ròng = Tài sản ngắn hạn - Nợ ngắn hạn. Thay số: 500 - 300 = 200 tỷ đồng. Vốn lưu động ròng dương cho thấy một phần tài sản ngắn hạn được tài trợ bằng nguồn vốn dài hạn. Tuy nhiên, cần xem xét khả năng thu hồi công nợ và chuyển đổi hàng tồn kho thành tiền."
},
{
  q: "Bài 6. Doanh nghiệp có nợ phải trả 800 tỷ đồng và vốn chủ sở hữu 600 tỷ đồng. Tổng tài sản theo phương trình kế toán là bao nhiêu?",
  a: ["1.200 tỷ đồng", "1.400 tỷ đồng", "1.600 tỷ đồng", "1.800 tỷ đồng"],
  c: 1,
  e: "Theo phương trình kế toán: Tổng tài sản = Nợ phải trả + Vốn chủ sở hữu. Thay số: 800 + 600 = 1.400 tỷ đồng. Đây là nguyên tắc cân bằng cơ bản của bảng cân đối kế toán. Tổng tài sản luôn bằng tổng nguồn vốn."
},
{
  q: "Bài 7. Doanh nghiệp có doanh thu thuần 1.000 tỷ đồng và lợi nhuận sau thuế 150 tỷ đồng. Tỷ suất lợi nhuận trên doanh thu (ROS) là bao nhiêu?",
  a: ["10%", "12%", "15%", "20%"],
  c: 2,
  e: "ROS = Lợi nhuận sau thuế / Doanh thu thuần × 100%. Thay số: 150 / 1.000 × 100% = 15%. Nghĩa là cứ 100 đồng doanh thu thuần tạo ra 15 đồng lợi nhuận sau thuế. ROS tăng có thể phản ánh biên lợi nhuận tốt hơn, nhưng cần phân tích nguyên nhân từ giá bán, giá vốn và chi phí."
},
{
  q: "Bài 8. Doanh nghiệp có lợi nhuận sau thuế 150 tỷ đồng, tổng tài sản đầu kỳ 1.000 tỷ và cuối kỳ 1.250 tỷ. ROA tính theo tổng tài sản bình quân là bao nhiêu?",
  a: ["10%", "12%", "13,33%", "15%"],
  c: 2,
  e: "Tổng tài sản bình quân = (1.000 + 1.250) / 2 = 1.125 tỷ đồng. ROA = Lợi nhuận sau thuế / Tổng tài sản bình quân × 100% = 150 / 1.125 × 100% = 13,33%. ROA phản ánh khả năng tạo lợi nhuận từ tài sản bình quân mà doanh nghiệp sử dụng."
},
{
  q: "Bài 9. Doanh nghiệp có lợi nhuận sau thuế 150 tỷ đồng, vốn chủ sở hữu đầu kỳ 600 tỷ và cuối kỳ 900 tỷ. ROE là bao nhiêu?",
  a: ["15%", "18%", "20%", "25%"],
  c: 2,
  e: "Vốn chủ sở hữu bình quân = (600 + 900) / 2 = 750 tỷ đồng. ROE = Lợi nhuận sau thuế / Vốn chủ sở hữu bình quân × 100% = 150 / 750 × 100% = 20%. Chỉ tiêu cho biết mỗi 100 đồng vốn chủ sở hữu bình quân tạo ra 20 đồng lợi nhuận sau thuế."
},
{
  q: "Bài 10. Giá vốn hàng bán trong năm là 300 tỷ đồng. Hàng tồn kho đầu kỳ 100 tỷ và cuối kỳ 200 tỷ. Vòng quay hàng tồn kho là bao nhiêu?",
  a: ["1,5 vòng", "2 vòng", "2,5 vòng", "3 vòng"],
  c: 1,
  e: "Hàng tồn kho bình quân = (100 + 200) / 2 = 150 tỷ đồng. Vòng quay hàng tồn kho = Giá vốn hàng bán / Hàng tồn kho bình quân = 300 / 150 = 2 vòng. Nghĩa là hàng tồn kho bình quân luân chuyển khoảng 2 vòng trong năm. Vòng quay thấp có thể phản ánh tồn kho chậm luân chuyển hoặc tích trữ hàng quá mức."
},
{
  q: "Bài 11. Doanh nghiệp có tiền và tương đương tiền 120 tỷ đồng, đầu tư tài chính ngắn hạn có tính thanh khoản cao 30 tỷ đồng, nợ ngắn hạn 300 tỷ đồng. Hệ số thanh toán tức thời theo cách tính gồm tiền và tương đương tiền là bao nhiêu?",
  a: ["0,3 lần", "0,4 lần", "0,5 lần", "0,6 lần"],
  c: 0,
  e: "Nếu tính hệ số thanh toán tức thời chỉ bằng tiền và tương đương tiền: 120 / 300 = 0,4 lần. Nếu tính thêm khoản đầu tư tài chính ngắn hạn có tính thanh khoản cao: (120 + 30) / 300 = 0,5 lần. Theo cách hiểu đề bài có tính cả khoản đầu tư ngắn hạn thanh khoản cao, đáp án đúng là C. Lưu ý phải thống nhất định nghĩa chỉ tiêu trước khi tính. (Sửa đáp án đúng: c = 2)."
},
{
  q: "Bài 12. Tài sản ngắn hạn của doanh nghiệp tăng từ 400 tỷ lên 520 tỷ đồng. Tốc độ tăng tài sản ngắn hạn là bao nhiêu?",
  a: ["20%", "25%", "30%", "35%"],
  c: 2,
  e: "Tốc độ tăng = (Giá trị cuối kỳ - Giá trị đầu kỳ) / Giá trị đầu kỳ × 100%. Thay số: (520 - 400) / 400 × 100% = 30%. Tài sản ngắn hạn tăng 30%. Cần tìm hiểu tăng do tiền, khoản phải thu hay hàng tồn kho để đánh giá chất lượng tăng trưởng."
},
{
  q: "Bài 13. Doanh thu thuần của doanh nghiệp tăng từ 800 tỷ lên 1.000 tỷ đồng. Tốc độ tăng doanh thu là bao nhiêu?",
  a: ["20%", "22,5%", "25%", "30%"],
  c: 2,
  e: "Tốc độ tăng doanh thu = (1.000 - 800) / 800 × 100% = 25%. Doanh thu tăng 25% so với kỳ trước. Tuy nhiên, tăng doanh thu chưa chắc đồng nghĩa tăng lợi nhuận; cần xem xét giá vốn, chi phí bán hàng và quản lý."
},
{
  q: "Bài 14. Doanh thu thuần là 1.200 tỷ đồng, giá vốn hàng bán là 840 tỷ đồng. Tỷ suất lợi nhuận gộp trên doanh thu là bao nhiêu?",
  a: ["20%", "25%", "30%", "35%"],
  c: 2,
  e: "Lợi nhuận gộp = Doanh thu thuần - Giá vốn hàng bán = 1.200 - 840 = 360 tỷ đồng. Biên lợi nhuận gộp = 360 / 1.200 × 100% = 30%. Chỉ tiêu phản ánh phần doanh thu còn lại sau khi trừ giá vốn, trước chi phí bán hàng, quản lý và các chi phí khác."
},
{
  q: "Bài 15. Doanh nghiệp có lợi nhuận gộp 360 tỷ đồng, chi phí bán hàng 100 tỷ, chi phí quản lý doanh nghiệp 80 tỷ và doanh thu hoạt động tài chính 20 tỷ. Bỏ qua các khoản chi phí và thu nhập khác, lợi nhuận trước lãi vay và thuế (EBIT) là bao nhiêu?",
  a: ["180 tỷ", "200 tỷ", "220 tỷ", "240 tỷ"],
  c: 1,
  e: "EBIT theo dữ liệu đề bài = Lợi nhuận gộp - Chi phí bán hàng - Chi phí quản lý + Doanh thu tài chính (giả sử doanh thu tài chính thuộc hoạt động được tính vào kết quả trước lãi vay và thuế) = 360 - 100 - 80 + 20 = 200 tỷ đồng. Khi phân tích thực tế, cần phân loại chính xác doanh thu tài chính và chi phí tài chính theo báo cáo."
},
{
  q: "Bài 16. Doanh nghiệp có lợi nhuận trước thuế 200 tỷ đồng và chi phí thuế thu nhập doanh nghiệp 40 tỷ đồng. Lợi nhuận sau thuế là bao nhiêu?",
  a: ["140 tỷ", "150 tỷ", "160 tỷ", "180 tỷ"],
  c: 2,
  e: "Lợi nhuận sau thuế = Lợi nhuận trước thuế - Chi phí thuế thu nhập doanh nghiệp = 200 - 40 = 160 tỷ đồng. Đây là phần lợi nhuận còn lại sau khi ghi nhận chi phí thuế thu nhập doanh nghiệp."
},
{
  q: "Bài 17. Doanh nghiệp có lợi nhuận sau thuế 90 tỷ đồng và doanh thu thuần 900 tỷ đồng. ROS là bao nhiêu?",
  a: ["8%", "9%", "10%", "12%"],
  c: 2,
  e: "ROS = 90 / 900 × 100% = 10%. Cứ 100 đồng doanh thu thuần, doanh nghiệp tạo ra 10 đồng lợi nhuận sau thuế. Nếu ROS giảm qua các năm, cần xem xét giá vốn tăng, chi phí hoạt động tăng hoặc doanh nghiệp giảm giá bán."
},
{
  q: "Bài 18. Doanh thu thuần tăng 20% nhưng lợi nhuận sau thuế chỉ tăng 5%. Nhận định nào phù hợp nhất?",
  a: ["Hiệu quả sinh lời trên doanh thu có thể suy giảm", "ROS chắc chắn tăng", "Chi phí chắc chắn giảm", "Doanh nghiệp chắc chắn không có nợ"],
  c: 0,
  e: "Khi doanh thu tăng nhanh hơn lợi nhuận sau thuế, biên lợi nhuận có xu hướng giảm nếu các điều kiện so sánh tương đương. Có thể do giá vốn, chi phí bán hàng, quản lý, lãi vay hoặc thuế tăng nhanh. Không thể kết luận chắc chắn chỉ từ hai tốc độ tăng trưởng mà không xem số liệu gốc."
},
{
  q: "Bài 19. Doanh nghiệp có lợi nhuận sau thuế 120 tỷ đồng và tổng tài sản bình quân 1.000 tỷ đồng. ROA là bao nhiêu?",
  a: ["10%", "12%", "15%", "20%"],
  c: 1,
  e: "ROA = Lợi nhuận sau thuế / Tổng tài sản bình quân × 100% = 120 / 1.000 × 100% = 12%. Chỉ tiêu cho biết mỗi 100 đồng tài sản bình quân tạo ra 12 đồng lợi nhuận sau thuế."
},
{
  q: "Bài 20. Lợi nhuận sau thuế là 100 tỷ đồng. Vốn chủ sở hữu đầu kỳ 400 tỷ và cuối kỳ 600 tỷ. ROE theo vốn chủ sở hữu bình quân là bao nhiêu?",

{
  q: "Bài 22. Vòng quay khoản phải thu của doanh nghiệp là 6 vòng/năm. Số ngày thu tiền bình quân theo quy ước 360 ngày là bao nhiêu?",

},
{
  q: "Bài 23. Giá vốn hàng bán là 720 tỷ đồng, hàng tồn kho bình quân 120 tỷ đồng. Vòng quay hàng tồn kho là bao nhiêu?",

{
  q: "Bài 24. Vòng quay hàng tồn kho là 4 vòng/năm. Số ngày tồn kho bình quân theo quy ước 360 ngày là bao nhiêu?",

{

{

},
{

},
{
  q: "Bài 28. Tổng tài sản của doanh nghiệp là 2.000 tỷ đồng, nợ phải trả là 1.200 tỷ đồng. Tỷ lệ vốn chủ sở hữu trên tổng tài sản là bao nhiêu?",

},
{

{

{
  q: "Bài 32. Doanh nghiệp có EBIT 240 tỷ đồng, chi phí lãi vay 80 tỷ đồng. Nếu EBIT giảm 25% và chi phí lãi vay không đổi, hệ số thanh toán lãi vay mới là bao nhiêu?",

},
{

  a: ["Doanh nghiệp chắc chắn phá sản", "Chất lượng lợi nhuận cần được kiểm tra vì lợi nhuận chưa chuyển hóa thành tiền", "Doanh nghiệp chắc chắn không có doanh thu", "CFO âm luôn là dấu hiệu tích cực"],

{
  q: "Bài 37. Doanh nghiệp có CFO 180 tỷ đồng, lợi nhuận sau thuế 120 tỷ đồng. Tỷ lệ CFO trên lợi nhuận sau thuế là bao nhiêu?",

{

{
  q: "Bài 39. Doanh nghiệp có ROS 10%, vòng quay tổng tài sản 2 lần và hệ số nhân vốn chủ sở hữu 1,5 lần. ROE theo mô hình Dupont ba nhân tố là bao nhiêu?",

{
  q: "Bài 40. Doanh nghiệp có ROS 8%, vòng quay tổng tài sản 1,5 lần và hệ số nhân vốn chủ sở hữu 2 lần. ROE là bao nhiêu?",

{
  q: "Bài 41. ROS của doanh nghiệp giảm từ 12% xuống 9%, trong khi vòng quay tổng tài sản và hệ số nhân vốn chủ sở hữu không đổi. ROE sẽ thay đổi như thế nào?",

{

},
{
  q: "Bài 43. Doanh nghiệp dự kiến doanh thu năm tới tăng 10% so với mức hiện tại 1.000 tỷ đồng. Doanh thu dự báo là bao nhiêu?",

{
  q: "Bài 46. Doanh nghiệp dự báo doanh thu năm tới 1.500 tỷ đồng. Khoản phải thu dự kiến bằng 20% doanh thu. Khoản phải thu dự báo là bao nhiêu?",

{
  q: "Bài 47. Doanh nghiệp có doanh thu thuần 1.000 tỷ đồng, giá vốn 700 tỷ, chi phí bán hàng 100 tỷ, chi phí quản lý 80 tỷ, chi phí lãi vay 20 tỷ và thuế thu nhập doanh nghiệp 20 tỷ. Lợi nhuận sau thuế là bao nhiêu? Giả sử không có khoản thu nhập, chi phí khác.",

{
  q: "Bài 71. Doanh nghiệp có lợi nhuận sau thuế 180 tỷ đồng, tổng tài sản đầu kỳ 1.400 tỷ và cuối kỳ 1.600 tỷ. ROA theo tổng tài sản bình quân là bao nhiêu?",
  a: ["10%", "11%", "12%", "13%"],
  c: 2,
  e: "Tổng tài sản bình quân = (1.400 + 1.600) / 2 = 1.500 tỷ. ROA = 180 / 1.500 × 100% = 12%. Đáp án C. Mỗi 100 đồng tài sản bình quân tạo ra 12 đồng lợi nhuận sau thuế."
},
{
  q: "Bài 72. Doanh nghiệp có EBIT 360 tỷ đồng, chi phí lãi vay 90 tỷ đồng. Sau đó EBIT giảm 20%, lãi vay không đổi. Hệ số thanh toán lãi vay mới là bao nhiêu?",
  a: ["2,8 lần", "3 lần", "3,2 lần", "4 lần"],
  c: 1,
  e: "EBIT mới = 360 × (1 - 20%) = 288 tỷ. Hệ số thanh toán lãi vay mới = 288 / 90 = 3,2 lần. Đáp án C (sửa c = 2). Ban đầu hệ số là 360 / 90 = 4 lần. Khả năng trang trải lãi vay suy giảm khi EBIT giảm, dù chi phí lãi vay không đổi."
},
{
  q: "Bài 73. Doanh nghiệp có tổng nợ phải trả 1.050 tỷ đồng và vốn chủ sở hữu 700 tỷ đồng. Hệ số nợ trên vốn chủ sở hữu (D/E) là bao nhiêu?",
  a: ["1,2 lần", "1,5 lần", "1,7 lần", "2 lần"],
  c: 1,
  e: "D/E = Tổng nợ phải trả / Vốn chủ sở hữu = 1.050 / 700 = 1,5 lần. Đáp án B. Cứ 1 đồng vốn chủ sở hữu tương ứng 1,5 đồng nợ phải trả. Chỉ tiêu này cần được đánh giá cùng khả năng tạo tiền và khả năng trả lãi."
},
{
  q: "Bài 74. Tổng tài sản của doanh nghiệp là 3.000 tỷ đồng, tổng nợ phải trả 1.800 tỷ. Hệ số tự tài trợ là bao nhiêu?",
  a: ["30%", "35%", "40%", "60%"],
  c: 2,
  e: "Vốn chủ sở hữu = 3.000 - 1.800 = 1.200 tỷ. Hệ số tự tài trợ = Vốn chủ sở hữu / Tổng tài sản × 100% = 1.200 / 3.000 × 100% = 40%. Đáp án C. Doanh nghiệp tự tài trợ 40% tài sản bằng vốn chủ sở hữu."
},
{
  q: "Bài 75. Doanh thu thuần là 1.800 tỷ đồng, khoản phải thu bình quân 300 tỷ. Giả sử toàn bộ doanh thu là bán chịu và dùng quy ước 360 ngày. Kỳ thu tiền bình quân là bao nhiêu ngày?",
  a: ["45 ngày", "50 ngày", "60 ngày", "75 ngày"],
  c: 2,
  e: "Vòng quay khoản phải thu = 1.800 / 300 = 6 vòng. Kỳ thu tiền bình quân = 360 / 6 = 60 ngày. Đáp án C. Doanh nghiệp mất trung bình 60 ngày để thu hồi công nợ. Nếu thời gian thu tiền dài hơn điều khoản tín dụng, cần xem xét rủi ro công nợ."
},
{
  q: "Bài 76. Giá vốn hàng bán là 900 tỷ đồng, hàng tồn kho bình quân 150 tỷ. Nếu năm tài chính quy ước 360 ngày, số ngày tồn kho bình quân là bao nhiêu?",
  a: ["45 ngày", "50 ngày", "60 ngày", "75 ngày"],
  c: 2,
  e: "Vòng quay hàng tồn kho = 900 / 150 = 6 vòng. Số ngày tồn kho bình quân = 360 / 6 = 60 ngày. Đáp án C. Hàng tồn kho nằm trong doanh nghiệp trung bình khoảng 60 ngày trước khi được bán hoặc sử dụng."
},
{
  q: "Bài 77. Doanh nghiệp có doanh thu thuần 2.400 tỷ đồng, tổng tài sản bình quân 1.200 tỷ. Vòng quay tổng tài sản là bao nhiêu?",
  a: ["1,5 lần", "2 lần", "2,5 lần", "3 lần"],
  c: 1,
  e: "Vòng quay tổng tài sản = Doanh thu thuần / Tổng tài sản bình quân = 2.400 / 1.200 = 2 lần. Đáp án B. Mỗi đồng tài sản bình quân tạo ra 2 đồng doanh thu. Chỉ tiêu phụ thuộc đặc điểm ngành và mô hình kinh doanh."
},
{
  q: "Bài 78. Doanh nghiệp có doanh thu thuần 1.500 tỷ đồng, tổng tài sản bình quân 1.000 tỷ, lợi nhuận sau thuế 90 tỷ. Theo Dupont hai nhân tố, ROA bằng ROS nhân với vòng quay tổng tài sản. ROA là bao nhiêu?",
  a: ["6%", "9%", "12%", "15%"],
  c: 1,
  e: "ROS = 90 / 1.500 = 6%. Vòng quay tổng tài sản = 1.500 / 1.000 = 1,5 lần. ROA = ROS × Vòng quay tổng tài sản = 6% × 1,5 = 9%. Có thể kiểm tra trực tiếp: 90 / 1.000 × 100% = 9%. Đáp án B."
},
{
  q: "Bài 79. Doanh nghiệp có ROS 6%, vòng quay tổng tài sản 1,5 lần và hệ số nhân vốn chủ sở hữu 2 lần. ROE theo Dupont là bao nhiêu?",
  a: ["12%", "15%", "18%", "20%"],
  c: 2,
  e: "ROE = ROS × Vòng quay tổng tài sản × Hệ số nhân vốn chủ sở hữu = 6% × 1,5 × 2 = 18%. Đáp án C. ROE chịu ảnh hưởng bởi cả biên lợi nhuận, hiệu quả sử dụng tài sản và đòn bẩy tài chính."
},
{
  q: "Bài 80. Doanh nghiệp có doanh thu thuần 2.000 tỷ đồng, giá vốn 1.400 tỷ, chi phí bán hàng 150 tỷ, chi phí quản lý 100 tỷ, chi phí lãi vay 50 tỷ và thuế thu nhập doanh nghiệp 60 tỷ. Lợi nhuận sau thuế là bao nhiêu? Giả sử không có khoản thu nhập, chi phí khác.",
  a: ["200 tỷ", "220 tỷ", "240 tỷ", "260 tỷ"],
  c: 2,
  e: "Lợi nhuận gộp = 2.000 - 1.400 = 600 tỷ. Lợi nhuận trước thuế = 600 - 150 - 100 - 50 = 300 tỷ. Lợi nhuận sau thuế = 300 - 60 = 240 tỷ. Đáp án C. Cần chú ý đề đã cho thuế thu nhập doanh nghiệp trực tiếp nên không cần tính thêm thuế suất."
},
{
  q: "Bài 81. Doanh nghiệp có lợi nhuận sau thuế 150 tỷ đồng, CFO 210 tỷ đồng. Tỷ lệ CFO trên lợi nhuận sau thuế là bao nhiêu?",
  a: ["120%", "130%", "140%", "150%"],
  c: 2,
  e: "CFO/LNST = 210 / 150 × 100% = 140%. Đáp án C. CFO lớn hơn lợi nhuận sau thuế, cho thấy dòng tiền kinh doanh trong kỳ cao hơn lợi nhuận kế toán. Cần xem xét các khoản điều chỉnh như khấu hao và biến động vốn lưu động để đánh giá tính bền vững."
},
{
  q: "Bài 82. Doanh nghiệp có CFO 300 tỷ đồng, chi mua sắm tài sản cố định 220 tỷ và tiền thu từ thanh lý tài sản cố định 20 tỷ. Nếu CAPEX được tính theo chi mua tài sản cố định trừ tiền thu thanh lý, FCF = CFO - CAPEX là bao nhiêu?",
  a: ["60 tỷ", "80 tỷ", "100 tỷ", "120 tỷ"],
  c: 2,
  e: "CAPEX ròng = 220 - 20 = 200 tỷ. FCF = CFO - CAPEX ròng = 300 - 200 = 100 tỷ đồng. Đáp án C. Đây là định nghĩa FCF đơn giản theo dữ liệu đề bài; khi phân tích thực tế cần nêu rõ cách xác định CAPEX."
},
{
  q: "Bài 83. CFO của doanh nghiệp là 120 tỷ đồng, tổng nợ phải trả bình quân 600 tỷ đồng. Tỷ lệ CFO trên tổng nợ phải trả bình quân là bao nhiêu?",
  a: ["10%", "15%", "20%", "25%"],
  c: 2,
  e: "Tỷ lệ CFO trên tổng nợ = CFO / Tổng nợ phải trả bình quân × 100% = 120 / 600 × 100% = 20%. Đáp án C. Chỉ tiêu cho biết dòng tiền kinh doanh trong kỳ bằng 20% tổng nợ bình quân. Đây là một góc nhìn về khả năng tạo tiền để đáp ứng nghĩa vụ nợ."
},
{
  q: "Bài 84. Lợi nhuận sau thuế là 100 tỷ đồng. Trong năm, khoản phải thu tăng 40 tỷ, hàng tồn kho tăng 20 tỷ và khoản phải trả tăng 10 tỷ. Bỏ qua các điều chỉnh khác, CFO theo phương pháp gián tiếp là bao nhiêu nếu bắt đầu từ lợi nhuận sau thuế và không có khấu hao?",
  a: ["40 tỷ", "50 tỷ", "60 tỷ", "70 tỷ"],
  c: 1,
  e: "Điều chỉnh vốn lưu động: khoản phải thu tăng 40 tỷ làm giảm tiền 40 tỷ; hàng tồn kho tăng 20 tỷ làm giảm tiền 20 tỷ; khoản phải trả tăng 10 tỷ làm tăng tiền 10 tỷ. CFO = 100 - 40 - 20 + 10 = 50 tỷ đồng. Đáp án B. Đây là phép tính giản lược; báo cáo thực tế còn có điều chỉnh lãi vay, thuế và các khoản phi tiền tệ."
},
{
  q: "Bài 85. Lợi nhuận sau thuế của doanh nghiệp là 200 tỷ đồng, khấu hao 50 tỷ, khoản phải thu tăng 30 tỷ, hàng tồn kho giảm 10 tỷ, khoản phải trả tăng 20 tỷ. Bỏ qua các điều chỉnh khác, CFO theo phương pháp gián tiếp là bao nhiêu?",
  a: ["230 tỷ", "240 tỷ", "250 tỷ", "270 tỷ"],
  c: 2,
  e: "CFO = LNST + Khấu hao - Tăng khoản phải thu + Giảm hàng tồn kho + Tăng khoản phải trả = 200 + 50 - 30 + 10 + 20 = 250 tỷ đồng. Đáp án C. Khấu hao là chi phí không bằng tiền nên được cộng lại; giảm hàng tồn kho và tăng khoản phải trả giải phóng tiền."
},
{
  q: "Bài 86. Doanh nghiệp có lợi nhuận sau thuế 180 tỷ đồng, CFO 60 tỷ. Khoản phải thu tăng 100 tỷ trong kỳ, các yếu tố khác không đổi. Nhận định nào phù hợp nhất?",
  a: ["CFO thấp hơn lợi nhuận, cần kiểm tra khả năng thu hồi công nợ", "Doanh nghiệp chắc chắn không bán được hàng", "Lợi nhuận sau thuế chắc chắn sai", "CFO thấp hơn LNST luôn là dấu hiệu tích cực"],
  c: 0,
  e: "CFO chỉ bằng 60/180 = 33,33% lợi nhuận sau thuế. Khoản phải thu tăng mạnh có thể khiến doanh thu đã ghi nhận nhưng chưa chuyển thành tiền. Cần kiểm tra tuổi nợ, khách hàng lớn, khoản phải thu quá hạn, dự phòng và chính sách bán chịu. Đây là tín hiệu cần phân tích chứ chưa đủ để kết luận sai phạm."
},
{
  q: "Bài 87. Doanh nghiệp dự kiến doanh thu năm tới tăng 15% từ mức 2.000 tỷ đồng. Giá vốn dự kiến giữ ở mức 70% doanh thu. Lợi nhuận gộp dự báo là bao nhiêu?",
  a: ["690 tỷ", "900 tỷ", "930 tỷ", "1.000 tỷ"],
  c: 2,
  e: "Doanh thu dự báo = 2.000 × 1,15 = 2.300 tỷ. Giá vốn dự báo = 2.300 × 70% = 1.610 tỷ. Lợi nhuận gộp = 2.300 - 1.610 = 690 tỷ. Đáp án không có 690 tỷ, vì vậy đề này cần sửa phương án. Phương án đúng nên là A. 690 tỷ đồng. (Sửa a thành [\"690 tỷ\", \"900 tỷ\", \"930 tỷ\", \"1.000 tỷ\"] và giữ c = 0)."
},
{
  q: "Bài 88. Doanh nghiệp dự báo doanh thu năm tới 1.800 tỷ đồng. Chi phí bán hàng dự kiến bằng 6% doanh thu. Chi phí bán hàng dự báo là bao nhiêu?",
  a: ["90 tỷ", "100 tỷ", "108 tỷ", "120 tỷ"],
  c: 2,
  e: "Chi phí bán hàng dự báo = Doanh thu dự báo × Tỷ lệ chi phí bán hàng = 1.800 × 6% = 108 tỷ đồng. Đáp án C. Đây là phương pháp dự báo chi phí theo tỷ lệ doanh thu, giả định tỷ lệ chi phí ổn định."
},
{
  q: "Bài 89. Doanh nghiệp dự kiến doanh thu năm tới 2.500 tỷ đồng, ROS mục tiêu 8,4%. Lợi nhuận sau thuế dự báo là bao nhiêu?",
  a: ["180 tỷ", "200 tỷ", "210 tỷ", "220 tỷ"],
  c: 2,
  e: "LNST dự báo = Doanh thu dự báo × ROS mục tiêu = 2.500 × 8,4% = 210 tỷ đồng. Đáp án C. Đây là dự báo giản lược theo biên lợi nhuận mục tiêu; cần kiểm tra tính khả thi của ROS dựa trên giá vốn, chi phí và thuế."
},
{
  q: "Bài 90. Doanh nghiệp dự báo doanh thu năm tới 3.000 tỷ đồng. Khoản phải thu bình quân dự kiến bằng 12% doanh thu. Khoản phải thu bình quân dự báo là bao nhiêu?",
  a: ["300 tỷ", "330 tỷ", "360 tỷ", "390 tỷ"],
  c: 2,
  e: "Khoản phải thu bình quân dự báo = 3.000 × 12% = 360 tỷ đồng. Đáp án C. Nếu doanh thu tăng nhưng tỷ lệ phải thu không đổi, quy mô vốn bị chiếm dụng trong công nợ cũng tăng theo."
},
{
  q: "Bài 91. Doanh nghiệp có doanh thu thuần năm N là 1.000 tỷ đồng, năm N+1 là 1.200 tỷ đồng; lợi nhuận sau thuế lần lượt là 100 tỷ và 108 tỷ. ROS năm N+1 là bao nhiêu?",
  a: ["8%", "9%", "10%", "12%"],
  c: 1,
  e: "ROS năm N+1 = 108 / 1.200 × 100% = 9%. Đáp án B. ROS năm N = 100 / 1.000 = 10%. Doanh thu tăng 20%, lợi nhuận tăng 8%, nhưng biên lợi nhuận giảm từ 10% xuống 9%, tức giảm 1 điểm phần trăm."
},
{
  q: "Bài 92. Doanh nghiệp có lợi nhuận sau thuế 120 tỷ đồng, tổng tài sản bình quân 1.000 tỷ, vốn chủ sở hữu bình quân 400 tỷ. ROA và ROE lần lượt là bao nhiêu?",
  a: ["10% và 25%", "12% và 30%", "15% và 25%", "12% và 35%"],
  c: 1,
  e: "ROA = 120 / 1.000 × 100% = 12%. ROE = 120 / 400 × 100% = 30%. Đáp án B. ROE cao hơn ROA do quy mô vốn chủ sở hữu thấp hơn tổng tài sản; có thể phản ánh tác động của đòn bẩy tài chính."
},
{
  q: "Bài 93. Doanh nghiệp có tổng tài sản 2.000 tỷ đồng, vốn chủ sở hữu 800 tỷ. Hệ số nhân vốn chủ sở hữu theo số liệu cuối kỳ là bao nhiêu?",
  a: ["1,5 lần", "2 lần", "2,5 lần", "3 lần"],
  c: 2,
  e: "Hệ số nhân vốn chủ sở hữu = Tổng tài sản / Vốn chủ sở hữu = 2.000 / 800 = 2,5 lần. Đáp án C. Hệ số này thể hiện mức độ sử dụng đòn bẩy tài chính. Trong Dupont đầy đủ, nên dùng số bình quân tương ứng với lợi nhuận của cả kỳ."
},
{
  q: "Bài 94. Doanh nghiệp có nợ phải trả đầu kỳ 900 tỷ, cuối kỳ 1.100 tỷ; tổng tài sản đầu kỳ 1.500 tỷ, cuối kỳ 1.700 tỷ. Tỷ lệ nợ trên tổng tài sản cuối kỳ là bao nhiêu?",
  a: ["55%", "60%", "64,71%", "70%"],
  c: 2,
  e: "Tỷ lệ nợ cuối kỳ = Nợ phải trả cuối kỳ / Tổng tài sản cuối kỳ × 100% = 1.100 / 1.700 × 100% = 64,71%. Đáp án C. Tỷ lệ nợ tăng từ 900/1.500 = 60% lên 64,71%, cho thấy mức độ sử dụng nợ tăng."
},
{
  q: "Bài 95. Doanh nghiệp có doanh thu thuần 2.000 tỷ đồng, giá vốn 1.400 tỷ, hàng tồn kho đầu kỳ 250 tỷ và cuối kỳ 350 tỷ. Vòng quay hàng tồn kho là bao nhiêu?",
  a: ["3 vòng", "4 vòng", "4,67 vòng", "5 vòng"],
  c: 1,
  e: "Hàng tồn kho bình quân = (250 + 350) / 2 = 300 tỷ. Vòng quay hàng tồn kho = Giá vốn / Hàng tồn kho bình quân = 1.400 / 300 = 4,67 vòng. Đáp án C (sửa c = 2). Chỉ tiêu cho biết hàng tồn kho luân chuyển khoảng 4,67 vòng trong năm."
},
{
  q: "Bài 96. Doanh nghiệp có doanh thu thuần 1.800 tỷ đồng, khoản phải thu đầu kỳ 200 tỷ và cuối kỳ 250 tỷ. Giả sử toàn bộ doanh thu là bán chịu, vòng quay khoản phải thu là bao nhiêu?",
  a: ["6 vòng", "7 vòng", "8 vòng", "9 vòng"],
  c: 2,
  e: "Khoản phải thu bình quân = (200 + 250) / 2 = 225 tỷ. Vòng quay khoản phải thu = 1.800 / 225 = 8 vòng. Đáp án C. Kỳ thu tiền bình quân theo 360 ngày = 360 / 8 = 45 ngày."
},
{
  q: "Bài 97. Doanh nghiệp có doanh thu thuần 1.500 tỷ đồng, tổng tài sản đầu kỳ 1.000 tỷ và cuối kỳ 1.500 tỷ. Vòng quay tổng tài sản theo số bình quân là bao nhiêu?",
  a: ["1 lần", "1,2 lần", "1,5 lần", "2 lần"],
  c: 1,
  e: "Tổng tài sản bình quân = (1.000 + 1.500) / 2 = 1.250 tỷ. Vòng quay tổng tài sản = 1.500 / 1.250 = 1,2 lần. Đáp án B. Cần dùng tài sản bình quân để phù hợp với doanh thu phát sinh trong cả kỳ."
},
{
  q: "Bài 98. Doanh nghiệp có EBIT 240 tỷ đồng, chi phí lãi vay 40 tỷ, thuế suất thuế thu nhập doanh nghiệp 20%. Lợi nhuận sau thuế theo giả định không có thu nhập, chi phí khác và EBIT đã trừ khấu hao là bao nhiêu?",
  a: ["140 tỷ", "150 tỷ", "160 tỷ", "180 tỷ"],
  c: 2,
  e: "Lợi nhuận trước thuế = EBIT - Chi phí lãi vay = 240 - 40 = 200 tỷ. Thuế = 200 × 20% = 40 tỷ. LNST = 200 - 40 = 160 tỷ. Đáp án C. EBIT là lợi nhuận trước lãi vay và thuế; cần trừ chi phí lãi vay trước khi tính thuế trong giả định của đề."
},
{
  q: "Bài 99. Doanh nghiệp có lợi nhuận sau thuế 100 tỷ đồng, khấu hao 30 tỷ, khoản phải thu tăng 20 tỷ, hàng tồn kho tăng 10 tỷ, khoản phải trả giảm 5 tỷ. Bỏ qua các yếu tố khác, CFO theo phương pháp gián tiếp là bao nhiêu?",
  a: ["85 tỷ", "90 tỷ", "95 tỷ", "105 tỷ"],
  c: 1,
  e: "CFO = LNST + Khấu hao - Tăng khoản phải thu - Tăng hàng tồn kho - Giảm khoản phải trả = 100 + 30 - 20 - 10 - 5 = 95 tỷ. Đáp án C (sửa c = 2). Khấu hao được cộng lại; tăng phải thu, tăng tồn kho và giảm phải trả đều làm giảm dòng tiền kinh doanh."
},
{
  q: "Bài 100. Doanh nghiệp có doanh thu thuần 2.400 tỷ đồng, giá vốn 1.680 tỷ, chi phí bán hàng 180 tỷ, chi phí quản lý 120 tỷ, chi phí lãi vay 60 tỷ, thuế thu nhập doanh nghiệp 72 tỷ. Tổng tài sản bình quân 1.800 tỷ và vốn chủ sở hữu bình quân 900 tỷ. LNST, ROA và ROE lần lượt là bao nhiêu? Giả sử không có khoản thu nhập, chi phí khác.",
  a: ["288 tỷ; 16%; 32%", "300 tỷ; 15%; 30%", "360 tỷ; 20%; 40%", "240 tỷ; 13,33%; 26,67%"],
  c: 0,
  e: "Bước 1: Lợi nhuận gộp = 2.400 - 1.680 = 720 tỷ. Bước 2: Lợi nhuận trước thuế = 720 - 180 - 120 - 60 = 360 tỷ. Bước 3: LNST = 360 - 72 = 288 tỷ. Bước 4: ROA = 288 / 1.800 × 100% = 16%. Bước 5: ROE = 288 / 900 × 100% = 32%. Đáp án A. Bài này kết hợp báo cáo kết quả kinh doanh với bảng cân đối kế toán để tính khả năng sinh lời."
}
];
// FIX: TỰ ĐỘNG ĐÁNH ID RIÊNG CHO TỪNG CÂU HỎI
questions.forEach((q, index) => {
    q.id = index + 1;
});

let mode="all",topic="Tất cả",current=0,exam=false,examQuestions=[];
let answers=JSON.parse(localStorage.getItem("bctc_answers")||"{}");
let bookmarks=JSON.parse(localStorage.getItem("bctc_bookmarks")||"[]");

function save(){
 localStorage.setItem("bctc_answers",JSON.stringify(answers));
 localStorage.setItem("bctc_bookmarks",JSON.stringify(bookmarks));
 updateStats();
}
function updateStats(){
 const done=Object.keys(answers).length;
 const right=Object.values(answers).filter(x=>x.correct).length;
 document.getElementById("total").textContent=questions.length;
 document.getElementById("done").textContent=done;
 document.getElementById("right").textContent=right;
 document.getElementById("rate").textContent=done?Math.round(right/done*100)+"%":"0%";
 const p=questions.length?Math.round(done/questions.length*100):0;
 document.getElementById("progressText").textContent=p+"%";
 document.getElementById("progressBar").style.width=p+"%";
}
function getFiltered(){
 let list=exam?examQuestions:questions;
 if(!exam){
  if(topic!=="Tất cả")list=list.filter(q=>q.topic===topic);
  if(mode==="unanswered")list=list.filter(q=>!answers[q.id]);
  if(mode==="wrong")list=list.filter(q=>answers[q.id]&&!answers[q.id].correct);
  if(mode==="bookmarked")list=list.filter(q=>bookmarks.includes(q.id));
 }
 const s=document.getElementById("search").value.toLowerCase();
 if(s)list=list.filter(q=>q.q.toLowerCase().includes(s));
 if(document.getElementById("sort").value==="random"&&!exam)list=[...list].sort(()=>Math.random()-.5);
 return list;
}
function renderTopics(){
 const topics=["Tất cả",...new Set(questions.map(q=>q.topic))];
 document.getElementById("topicList").innerHTML=topics.map(t=>
 `<button class="${topic===t?'active':''}" onclick="setTopic('${t}')">${t}</button>`
 ).join("");
}
function setTopic(t){topic=t;mode="all";exam=false;current=0;renderTopics();render()}
function setMode(m,el){
 mode=m;topic="Tất cả";exam=false;current=0;
 document.querySelectorAll(".sidebar button").forEach(b=>b.classList.remove("active"));
 el.classList.add("active");renderTopics();render();
}
function render(){
 const list=getFiltered();
 if(current>=list.length)current=0;
 const area=document.getElementById("questionArea");
 if(!list.length){area.innerHTML="<div class='panel'>Không có câu hỏi phù hợp.</div>";return}
 const q=list[current];
 const saved=answers[q.id];
 area.innerHTML=`
 <div class="question">
  <div class="qtop">
   <span>Câu ${q.id} / ${questions.length} · ${q.topic}</span>
   <span class="tag">${q.type}</span>
  </div>
  <div class="qtext">${q.q}</div>
  ${q.a.map((a,i)=>`
   <button class="option ${saved?(i===q.c?'correct':(i===saved.choice?'wrong':'')):''}"
    onclick="choose(${q.id},${i})" ${saved?'disabled':''}>
    ${String.fromCharCode(65+i)}. ${a}
   </button>`).join("")}
  <div class="explain ${saved?'show':''}" id="explain">
   <b>${saved?(saved.correct?'Chính xác!':'Chưa chính xác!'):'Giải thích'}</b><br>
   Đáp án: <b>${String.fromCharCode(65+q.c)}</b>. ${q.a[q.c]}<br>
   ${q.e}
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
   <button class="action" onclick="toggleBookmark(${q.id})">
    ${bookmarks.includes(q.id)?'★ Đã đánh dấu':'☆ Đánh dấu'}
   </button>
   <button class="action" onclick="showAnswer(${q.id})">Xem đáp án</button>
  </div>
 </div>
 <div style="color:var(--muted);font-size:13px;text-align:center">
  ${current+1} / ${list.length} câu trong danh sách hiện tại
 </div>`;
 document.getElementById("examInfo").classList.toggle("hidden",!exam);
 if(exam)document.getElementById("examInfo").innerHTML=
 `<b>Chế độ thi thử:</b> ${current+1}/${examQuestions.length} câu. Chọn đáp án để ghi nhận kết quả.`;
}
function choose(id,i){
 const q=questions.find(x=>x.id===id);
 if(answers[id])return;
 answers[id]={choice:i,correct:i===q.c};
 save();render();
}
function showAnswer(id){
 const q=questions.find(x=>x.id===id);
 const box=document.getElementById("explain");
 box.classList.add("show");
 box.innerHTML=`<b>Đáp án: ${String.fromCharCode(65+q.c)}. ${q.a[q.c]}</b><br>${q.e}`;
}
function toggleBookmark(id){
 bookmarks=bookmarks.includes(id)?bookmarks.filter(x=>x!==id):[...bookmarks,id];
 save();render();
}
function nextQuestion(){
 const list=getFiltered();if(current<list.length-1)current++;render();
}
function previousQuestion(){if(current>0)current--;render()}
function startExam(){
 exam=true;mode="all";topic="Tất cả";current=0;
 examQuestions=[...questions].sort(()=>Math.random()-.5).slice(0,Math.min(50,questions.length));
 renderTopics();render();
}
function resetProgress(){
 if(confirm("Bạn có chắc muốn xóa toàn bộ lịch sử làm bài?")){
  answers={};bookmarks=[];save();render();
 }
}
renderTopics();updateStats();render();
</script>
</body>
</html>
