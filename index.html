
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn thi Phân tích BCTC - 200 câu</title>
<style>
:root {
  --bg:#f3f5f9;--panel:#fff;--nav:#142238;--primary:#2563eb;
  --text:#182235;--muted:#64748b;--border:#e2e8f0;
  --green:#15803d;--red:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font-family:Arial,sans-serif}
header{background:var(--nav);color:white;padding:22px 5%;
display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
header h1{font-size:21px;margin:0 0 6px}
header p{margin:0;color:#cbd5e1;font-size:13px}
.container{max-width:1150px;margin:24px auto;padding:0 16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat,.panel,.question{background:white;border:1px solid var(--border);
border-radius:12px;padding:17px}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:25px;margin-top:7px}
.layout{display:grid;grid-template-columns:250px 1fr;gap:18px}
.sidebar{height:max-content}
.sidebar button,.action{width:100%;border:0;border-radius:8px;padding:11px;
margin:4px 0;text-align:left;background:#f1f5f9;color:var(--text);
cursor:pointer;font-size:14px}
.sidebar button.active,.action.primary{background:var(--primary);color:white}
.action{width:auto;text-align:center;padding:10px 15px}
select,input{padding:10px;border:1px solid var(--border);border-radius:8px;
background:white;color:var(--text)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.question{margin-bottom:14px}
.qtop{display:flex;justify-content:space-between;gap:10px;color:var(--muted);
font-size:12px;margin-bottom:13px}
.qtext{font-weight:600;line-height:1.6;margin-bottom:15px}
.option{display:block;width:100%;text-align:left;padding:12px;
border:1px solid var(--border);border-radius:8px;background:white;
margin:8px 0;cursor:pointer;line-height:1.5}
.option:hover{border-color:var(--primary);background:#eff6ff}
.option.correct{border-color:var(--green);background:#f0fdf4}
.option.wrong{border-color:var(--red);background:#fef2f2}
.explain{display:none;background:#f8fafc;border-left:4px solid var(--primary);
padding:13px;margin-top:13px;border-radius:5px;line-height:1.6;font-size:14px}
.explain.show{display:block}
.tag{font-size:11px;background:#eaf1ff;color:#1d4ed8;
padding:5px 8px;border-radius:20px}
.progress{height:8px;background:#e2e8f0;border-radius:20px;overflow:hidden}
.progress div{height:100%;background:var(--primary);width:0}
#questionArea{min-height:300px}
.hidden{display:none!important}
.footer{color:var(--muted);font-size:12px;text-align:center;margin:25px}
@media(max-width:750px){
 .layout{grid-template-columns:1fr}
 .stats{grid-template-columns:repeat(2,1fr)}
 .sidebar{display:grid;grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<header>
 <div>
  <h1>LUYỆN THI PHÂN TÍCH BÁO CÁO TÀI CHÍNH</h1>
  <p>Ôn tập chứng chỉ chuyên môn chứng khoán – UBCKNN</p>
 </div>
 <div>NGÂN HÀNG CÂU HỎI 200 CÂU</div>
</header>

<div class="container">
 <div class="stats">
  <div class="stat"><small>Tổng số câu hiện có</small><strong id="total">0</strong></div>
  <div class="stat"><small>Đã làm</small><strong id="done">0</strong></div>
  <div class="stat"><small>Trả lời đúng</small><strong id="right">0</strong></div>
  <div class="stat"><small>Tỷ lệ chính xác</small><strong id="rate">0%</strong></div>
 </div>

 <div class="panel" style="margin-bottom:18px">
  <div style="display:flex;justify-content:space-between;margin-bottom:9px">
   <b>Tiến độ ôn tập</b><span id="progressText">0%</span>
  </div>
  <div class="progress"><div id="progressBar"></div></div>
 </div>

 <div class="layout">
  <aside class="panel sidebar">
   <b>CHẾ ĐỘ HỌC</b>
   <button class="active" onclick="setMode('all',this)">Tất cả câu hỏi</button>
   <button onclick="setMode('unanswered',this)">Câu chưa làm</button>
   <button onclick="setMode('wrong',this)">Câu trả lời sai</button>
   <button onclick="setMode('bookmarked',this)">Câu đã đánh dấu</button>
   <button onclick="startExam()">Thi thử 50 câu</button>
   <button onclick="resetProgress()">Xóa tiến độ</button>
   <hr style="border:0;border-top:1px solid var(--border);margin:13px 0">
   <b>CHUYÊN ĐỀ</b>
   <div id="topicList"></div>
  </aside>

  <main>
   <div class="toolbar">
    <input id="search" placeholder="Tìm nội dung câu hỏi..." oninput="render()">
    <select id="sort" onchange="render()">
     <option value="normal">Thứ tự câu hỏi</option>
     <option value="random">Ngẫu nhiên</option>
    </select>
   </div>
   <div id="examInfo" class="panel hidden" style="margin-bottom:12px"></div>
   <div id="questionArea"></div>
   <div style="display:flex;justify-content:space-between;gap:10px">
    <button class="action" onclick="previousQuestion()">← Câu trước</button>
    <button class="action primary" onclick="nextQuestion()">Câu tiếp theo →</button>
   </div>
  </main>
 </div>
 <div class="footer">
  Tài liệu ôn tập tham khảo, không phải đề thi chính thức của UBCKNN.
 </div>
</div>

{ id:51,topic:"Kết quả kinh doanh",type:"Lý thuyết",q:"Doanh thu thuần được xác định như thế nào?",a:["Doanh thu bán hàng và cung cấp dịch vụ trừ các khoản giảm trừ doanh thu","Doanh thu cộng chi phí","Lợi nhuận trước thuế cộng thuế","Tổng tài sản trừ nợ phải trả"],c:0,e:"Doanh thu thuần = Doanh thu bán hàng và cung cấp dịch vụ - các khoản giảm trừ doanh thu."},

{ id:56,topic:"Kết quả kinh doanh",type:"Lý thuyết",q:"EBIT thường được hiểu là gì?",a:["Lợi nhuận trước lãi vay và thuế","Lợi nhuận sau thuế","Doanh thu thuần","Dòng tiền thuần từ đầu tư"],c:0,e:"EBIT là Earnings Before Interest and Taxes, phản ánh lợi nhuận trước chi phí lãi vay và thuế thu nhập doanh nghiệp."},

{ id:68,topic:"Kết quả kinh doanh",type:"Tính toán",q:"Doanh thu thuần 5.000 tỷ, giá vốn 3.500 tỷ. Biên lợi nhuận gộp là bao nhiêu?",a:["20%","25%","30%","35%"],c:2,e:"Lợi nhuận gộp = 5.000 - 3.500 = 1.500 tỷ. Biên gộp = 1.500 / 5.000 = 30%."},
{ id:69,topic:"Kết quả kinh doanh",type:"Tính toán",q:"Lợi nhuận sau thuế năm trước 100 tỷ, năm nay 125 tỷ. Tốc độ tăng lợi nhuận là bao nhiêu?",a:["15%","20%","25%","30%"],c:2,e:"(125 - 100) / 100 × 100% = 25%."},
{ id:70,topic:"Kết quả kinh doanh",type:"Lý thuyết",q:"Nếu doanh thu tăng 15% nhưng giá vốn tăng 25%, điều gì có thể xảy ra?",a:["Biên lợi nhuận gộp chịu áp lực giảm","Biên lợi nhuận gộp chắc chắn tăng","Lợi nhuận luôn tăng 25%","Không có tác động"],c:0,e:"Nếu giá vốn tăng nhanh hơn doanh thu, biên lợi nhuận gộp có xu hướng giảm, tùy mức thay đổi giá trị tuyệt đối."},

{ id:71,topic:"Lưu chuyển tiền tệ",type:"Lý thuyết",q:"Dòng tiền từ hoạt động kinh doanh (CFO) phản ánh điều gì?",a:["Tiền thu và chi liên quan đến hoạt động kinh doanh chủ yếu","Chỉ tiền mua tài sản cố định","Chỉ tiền vay và trả nợ","Chỉ cổ tức trả cổ đông"],c:0,e:"CFO phản ánh dòng tiền từ hoạt động tạo doanh thu chính và các hoạt động khác không thuộc đầu tư hoặc tài chính."},
{ id:72,topic:"Lưu chuyển tiền tệ",type:"Lý thuyết",q:"Tiền chi mua máy móc, thiết bị thường thuộc dòng tiền nào?",a:["Hoạt động kinh doanh","Hoạt động đầu tư","Hoạt động tài chính","Không thuộc báo cáo lưu chuyển tiền tệ"],c:1,e:"Mua sắm tài sản dài hạn thường được phân loại là dòng tiền từ hoạt động đầu tư."},
{ id:73,topic:"Lưu chuyển tiền tệ",type:"Lý thuyết",q:"Tiền thu từ phát hành cổ phiếu thường được phân loại vào đâu?",a:["Hoạt động kinh doanh","Hoạt động đầu tư","Hoạt động tài chính","Chi phí hoạt động"],c:2,e:"Phát hành cổ phiếu làm tăng nguồn vốn chủ sở hữu và thuộc dòng tiền tài chính."},
{ id:74,topic:"Lưu chuyển tiền tệ",type:"Lý thuyết",q:"Khấu hao được cộng lại khi điều chỉnh lợi nhuận theo phương pháp gián tiếp vì sao?",a:["Khấu hao là chi phí kế toán không làm phát sinh dòng tiền chi ra trong kỳ","Khấu hao là doanh thu tiền mặt","Khấu hao làm tăng vốn góp","Khấu hao là khoản vay"],c:0,e:"Khấu hao đã làm giảm lợi nhuận kế toán nhưng không phải khoản chi tiền trong kỳ nên được điều chỉnh cộng lại khi tính CFO gián tiếp."},
{ id:75,topic:"Lưu chuyển tiền tệ",type:"Lý thuyết",q:"Doanh nghiệp có lợi nhuận sau thuế dương nhưng CFO âm trong nhiều kỳ có thể là dấu hiệu gì?",a:["Rủi ro về chất lượng lợi nhuận hoặc vốn lưu động","Chắc chắn doanh nghiệp không có doanh thu","Chắc chắn không có nợ","Chắc chắn có khả năng thanh toán tốt"],c:0,e:"Cần xem xét phải thu tăng, tồn kho tăng, trả trước tăng, lợi nhuận chưa chuyển thành tiền hoặc các khoản bất thường."},
{ id:76,topic:"Lưu chuyển tiền tệ",type:"Lý thuyết",q:"Dòng tiền đầu tư âm có nhất thiết là dấu hiệu xấu không?",a:["Có, trong mọi trường hợp","Không, có thể do doanh nghiệp đầu tư mở rộng hoặc thay mới tài sản","Luôn đồng nghĩa phá sản","Luôn đồng nghĩa lợi nhuận âm"],c:1,e:"Dòng tiền đầu tư âm có thể phản ánh chi đầu tư tài sản phục vụ tăng trưởng. Cần xem hiệu quả và nguồn tài trợ."},
{ id:77,topic:"Lưu chuyển tiền tệ",type:"Lý thuyết",q:"Dòng tiền tài chính dương lớn có thể xuất phát từ đâu?",a:["Vay nợ hoặc phát hành cổ phiếu","Thu tiền bán hàng","Thu hồi công nợ khách hàng","Bán hàng tồn kho"],c:0,e:"Dòng tiền tài chính dương có thể do huy động vốn vay hoặc vốn chủ sở hữu."},
{ id:78,topic:"Lưu chuyển tiền tệ",type:"Lý thuyết",q:"Free Cash Flow to Firm (FCFF) thường được hiểu là gì?",a:["Dòng tiền tự do dành cho toàn bộ nhà cung cấp vốn","Doanh thu thuần","Lợi nhuận sau thuế chưa phân phối","Tổng nợ ngắn hạn"],c:0,e:"FCFF là dòng tiền hoạt động sau thuế và sau đầu tư cần thiết, sẵn có cho cả chủ nợ và cổ đông."},
{ id:79,topic:"Lưu chuyển tiền tệ",type:"Tính toán",q:"CFO 300 tỷ, chi mua tài sản cố định 180 tỷ. FCFF đơn giản trước các điều chỉnh khác là bao nhiêu?",a:["100 tỷ","120 tỷ","180 tỷ","480 tỷ"],c:1,e:"Theo cách tính đơn giản CFO - chi đầu tư tài sản cố định = 300 - 180 = 120 tỷ. FCFF chuẩn có thể cần điều chỉnh thêm lãi vay sau thuế và các khoản khác."},
{ id:80,topic:"Lưu chuyển tiền tệ",type:"Tính toán",q:"Tiền đầu kỳ 100 tỷ, dòng tiền thuần trong kỳ tăng 30 tỷ. Tiền cuối kỳ là bao nhiêu?",a:["70 tỷ","100 tỷ","130 tỷ","300 tỷ"],c:2,e:"Tiền cuối kỳ = Tiền đầu kỳ + Lưu chuyển tiền thuần = 100 + 30 = 130 tỷ."},

{ id:81,topic:"Lưu chuyển tiền tệ",type:"Tính toán",q:"CFO 250 tỷ, dòng tiền đầu tư âm 150 tỷ, dòng tiền tài chính âm 50 tỷ. Lưu chuyển tiền thuần trong kỳ là bao nhiêu?",a:["50 tỷ","100 tỷ","150 tỷ","450 tỷ"],c:0,e:"Lưu chuyển tiền thuần = 250 - 150 - 50 = 50 tỷ."},
{ id:82,topic:"Lưu chuyển tiền tệ",type:"Lý thuyết",q:"Phải thu khách hàng tăng mạnh thường ảnh hưởng thế nào đến CFO theo phương pháp gián tiếp, nếu các yếu tố khác không đổi?",a:["Làm giảm CFO","Làm tăng CFO","Không ảnh hưởng CFO","Làm tăng vốn điều lệ"],c:0,e:"Phải thu tăng nghĩa là doanh thu đã ghi nhận nhưng tiền chưa thu được, thường được điều chỉnh giảm khi tính CFO."},
{ id:83,topic:"Lưu chuyển tiền tệ",type:"Lý thuyết",q:"Hàng tồn kho tăng, các yếu tố khác không đổi, thường ảnh hưởng thế nào đến CFO theo phương pháp gián tiếp?",a:["Làm giảm CFO","Làm tăng CFO","Không ảnh hưởng","Làm tăng dòng tiền tài chính"],c:0,e:"Tồn kho tăng sử dụng tiền để dự trữ hàng hóa, do đó thường làm giảm dòng tiền kinh doanh."},
{ id:84,topic:"Lưu chuyển tiền tệ",type:"Lý thuyết",q:"Khoản phải trả người bán tăng, các yếu tố khác không đổi, thường ảnh hưởng thế nào đến CFO?",a:["Làm tăng CFO","Làm giảm CFO","Không ảnh hưởng","Làm giảm doanh thu"],c:0,e:"Doanh nghiệp chưa thanh toán tiền cho nhà cung cấp nên giữ lại tiền mặt trong kỳ, làm tăng CFO theo phương pháp gián tiếp."},
{ id:85,topic:"Lưu chuyển tiền tệ",type:"Lý thuyết",q:"CFO âm trong một năm của doanh nghiệp đang tăng trưởng nhanh nên được đánh giá thế nào?",a:["Phải phân tích nguyên nhân, chu kỳ kinh doanh và vốn lưu động","Luôn kết luận doanh nghiệp phá sản","Luôn kết luận gian lận","Không cần quan tâm"],c:0,e:"CFO âm có thể do tăng tồn kho, phải thu hoặc tăng trưởng nhanh; cần xem khả năng chuyển thành tiền trong các kỳ sau."},

{ id:86,topic:"Cơ cấu vốn",type:"Lý thuyết",q:"Cơ cấu vốn của doanh nghiệp phản ánh điều gì?",a:["Tỷ trọng các nguồn tài trợ như nợ phải trả và vốn chủ sở hữu","Chỉ cơ cấu nhân sự","Chỉ doanh thu theo sản phẩm","Chỉ số lượng nhà cung cấp"],c:0,e:"Cơ cấu vốn phản ánh cách doanh nghiệp sử dụng nợ và vốn chủ sở hữu để tài trợ tài sản, hoạt động."},
{ id:87,topic:"Cơ cấu vốn",type:"Lý thuyết",q:"Sử dụng nợ vay có thể tạo ra tác động nào?",a:["Khuếch đại lợi nhuận trên vốn chủ khi hiệu quả sử dụng vốn cao hơn chi phí nợ, đồng thời tăng rủi ro","Luôn làm giảm rủi ro","Không phát sinh nghĩa vụ thanh toán","Luôn làm tăng tiền mặt vĩnh viễn"],c:0,e:"Đòn bẩy tài chính có thể làm ROE tăng nhưng cũng làm tăng nghĩa vụ lãi vay và rủi ro mất khả năng thanh toán."},
{ id:88,topic:"Cơ cấu vốn",type:"Lý thuyết",q:"Tỷ lệ nợ trên tổng tài sản cao thường hàm ý điều gì?",a:["Mức độ sử dụng nguồn vốn vay và nghĩa vụ nợ cao hơn","Doanh nghiệp không có tài sản","Doanh nghiệp không có chi phí lãi vay","Lợi nhuận chắc chắn tăng"],c:0,e:"Tỷ lệ nợ cao cho thấy chủ nợ tài trợ tỷ trọng lớn hơn trong tổng tài sản và có thể làm tăng rủi ro tài chính."},
{ id:89,topic:"Cơ cấu vốn",type:"Lý thuyết",q:"Hệ số khả năng thanh toán lãi vay thấp có thể cho thấy điều gì?",a:["Khả năng tạo lợi nhuận để trang trải lãi vay yếu","Doanh nghiệp có tiền mặt vô hạn","Doanh thu chắc chắn tăng","Không có rủi ro tín dụng"],c:0,e:"Interest coverage thấp nghĩa là EBIT chỉ vừa đủ hoặc không đủ bù chi phí lãi vay."},
{ id:90,topic:"Cơ cấu vốn",type:"Tính toán",q:"EBIT 500 tỷ, chi phí lãi vay 100 tỷ. Hệ số thanh toán lãi vay là bao nhiêu?",a:["2 lần","3 lần","5 lần","10 lần"],c:2,e:"Interest coverage = 500 / 100 = 5 lần."},
{ id:91,topic:"Cơ cấu vốn",type:"Tính toán",q:"Tổng nợ 800 tỷ, tổng tài sản 2.000 tỷ. Tỷ lệ nợ trên tổng tài sản là bao nhiêu?",a:["20%","30%","40%","50%"],c:2,e:"Debt ratio = 800 / 2.000 × 100% = 40%."},
{ id:92,topic:"Cơ cấu vốn",type:"Tính toán",q:"Nợ phải trả 900 tỷ, vốn chủ sở hữu 600 tỷ. Tổng tài sản là bao nhiêu nếu không có khoản điều chỉnh khác?",a:["900 tỷ","1.200 tỷ","1.500 tỷ","2.000 tỷ"],c:2,e:"Tổng tài sản = Nợ phải trả + Vốn chủ sở hữu = 900 + 600 = 1.500 tỷ."},
{ id:93,topic:"Cơ cấu vốn",type:"Lý thuyết",q:"Khi lãi suất thị trường tăng, doanh nghiệp có tỷ trọng nợ vay lãi suất thả nổi cao có thể gặp rủi ro nào?",a:["Chi phí lãi vay tăng","Chi phí lãi vay chắc chắn giảm","Doanh thu tự động tăng","Nợ phải trả tự động biến mất"],c:0,e:"Lãi suất tăng có thể làm tăng chi phí tài chính và áp lực dòng tiền trả nợ."},
{ id:94,topic:"Cơ cấu vốn",type:"Lý thuyết",q:"Doanh nghiệp vay ngắn hạn để tài trợ tài sản dài hạn có thể phát sinh rủi ro nào?",a:["Rủi ro mất cân đối kỳ hạn và tái cấp vốn","Không có rủi ro","Rủi ro hàng tồn kho bằng 0","Rủi ro thuế biến mất"],c:0,e:"Nguồn vốn đến hạn trước khi tài sản tạo ra dòng tiền có thể gây áp lực thanh khoản và tái cấp vốn."},
{ id:95,topic:"Cơ cấu vốn",type:"Lý thuyết",q:"Một doanh nghiệp có D/E thấp có chắc chắn an toàn tài chính không?",a:["Có, luôn luôn","Không, vẫn cần đánh giá dòng tiền, thanh khoản và khả năng sinh lời","Có, nếu doanh thu lớn","Có, nếu có nhiều nhân viên"],c:1,e:"Đòn bẩy thấp không loại bỏ rủi ro kinh doanh, rủi ro thanh khoản hoặc suy giảm lợi nhuận."},
{ id:96,topic:"Cơ cấu vốn",type:"Lý thuyết",q:"Vốn chủ sở hữu âm thường là dấu hiệu đáng chú ý vì sao?",a:["Lỗ lũy kế hoặc các khoản điều chỉnh đã làm vốn chủ sở hữu giảm xuống dưới 0","Doanh nghiệp chắc chắn có tiền mặt lớn","Doanh nghiệp không có nợ","Doanh nghiệp có ROE cao và an toàn"],c:0,e:"Vốn chủ sở hữu âm là dấu hiệu suy yếu nghiêm trọng về cấu trúc tài chính; cần phân tích nguyên nhân và khả năng phục hồi."},
{ id:97,topic:"Cơ cấu vốn",type:"Tính toán",q:"Tổng tài sản 3.000 tỷ, nợ phải trả 1.800 tỷ. Tỷ lệ vốn chủ sở hữu trên tổng tài sản là bao nhiêu?",a:["30%","40%","50%","60%"],c:1,e:"Vốn chủ sở hữu = 3.000 - 1.800 = 1.200 tỷ. Tỷ lệ = 1.200 / 3.000 = 40%."},
{ id:98,topic:"Cơ cấu vốn",type:"Lý thuyết",q:"Khi đánh giá nợ vay, chỉ tiêu nào nên được xem xét cùng D/E?",a:["Khả năng thanh toán lãi vay và dòng tiền trả nợ","Số lượng nhân viên","Diện tích văn phòng","Số lượng sản phẩm"],c:0,e:"D/E chỉ phản ánh mức đòn bẩy; cần xem khả năng tạo lợi nhuận và dòng tiền để trả lãi, gốc."},
{ id:99,topic:"Cơ cấu vốn",type:"Lý thuyết",q:"Doanh nghiệp có khoản nợ ngoại tệ lớn nhưng doanh thu chủ yếu bằng VND có thể đối mặt với rủi ro nào?",a:["Rủi ro tỷ giá","Rủi ro tồn kho bằng 0","Rủi ro khấu hao","Rủi ro cổ tức tự động tăng"],c:0,e:"Nếu đồng ngoại tệ tăng giá so với VND, nghĩa vụ nợ quy đổi sang VND có thể tăng."},
{ id:100,topic:"Cơ cấu vốn",type:"Lý thuyết",q:"Khi đánh giá tính bền vững của cơ cấu vốn, yếu tố nào quan trọng?",a:["Khả năng tạo dòng tiền, chi phí vốn, kỳ hạn nợ và mức độ biến động lợi nhuận","Chỉ vốn điều lệ","Chỉ số lượng cổ đông","Chỉ giá cổ phiếu tại ngày phân tích"],c:0,e:"Cần xem xét khả năng trả nợ qua chu kỳ kinh doanh, chi phí vốn và sự phù hợp giữa kỳ hạn nguồn vốn với tài sản."}

,
{ id:101,topic:"Thanh khoản",type:"Lý thuyết",q:"Hệ số thanh toán hiện hành được tính bằng công thức nào?",a:["Tài sản ngắn hạn / Nợ ngắn hạn","Tổng tài sản / Tổng nợ","Tiền / Vốn chủ sở hữu","Doanh thu / Nợ ngắn hạn"],c:0,e:"Current ratio = Tài sản ngắn hạn / Nợ ngắn hạn."},
{ id:102,topic:"Thanh khoản",type:"Lý thuyết",q:"Hệ số thanh toán nhanh khác hệ số hiện hành ở điểm nào?",a:["Loại hàng tồn kho khỏi tài sản ngắn hạn trong công thức cơ bản","Loại toàn bộ tiền khỏi tài sản","Cộng thêm tài sản cố định","Chỉ sử dụng doanh thu"],c:0,e:"Quick ratio thường = (Tài sản ngắn hạn - Hàng tồn kho) / Nợ ngắn hạn."},
{ id:103,topic:"Thanh khoản",type:"Lý thuyết",q:"Hệ số thanh toán tiền mặt tập trung vào nhóm tài sản nào?",a:["Tiền, tương đương tiền và khoản đầu tư ngắn hạn đủ điều kiện","Hàng tồn kho và tài sản cố định","Toàn bộ tài sản dài hạn","Doanh thu chưa thực hiện"],c:0,e:"Cash ratio đánh giá khả năng thanh toán nợ ngắn hạn bằng nguồn tiền có tính thanh khoản cao."},
{ id:104,topic:"Thanh khoản",type:"Lý thuyết",q:"Hệ số thanh toán hiện hành nhỏ hơn 1 có thể cho thấy điều gì?",a:["Tài sản ngắn hạn thấp hơn nợ ngắn hạn","Doanh nghiệp chắc chắn có lãi","Doanh nghiệp không có hàng tồn kho","Doanh nghiệp không có nợ dài hạn"],c:0,e:"Current ratio dưới 1 cho thấy tài sản ngắn hạn không đủ bù nợ ngắn hạn theo giá trị sổ sách; cần phân tích sâu chất lượng tài sản và chu kỳ tiền."},
{ id:105,topic:"Thanh khoản",type:"Lý thuyết",q:"Vì sao không nên đánh giá thanh khoản chỉ bằng một hệ số?",a:["Vì mỗi hệ số phản ánh một khía cạnh và có thể bị ảnh hưởng bởi chất lượng tài sản","Vì các hệ số không có ý nghĩa","Vì chỉ doanh thu mới quan trọng","Vì nợ ngắn hạn không cần thanh toán"],c:0,e:"Nên kết hợp current ratio, quick ratio, cash ratio, vốn lưu động ròng và dòng tiền hoạt động."},
{ id:106,topic:"Thanh khoản",type:"Tính toán",q:"Tài sản ngắn hạn 1.000 tỷ, nợ ngắn hạn 500 tỷ. Current ratio bằng bao nhiêu?",a:["0,5 lần","1 lần","2 lần","2,5 lần"],c:2,e:"1.000 / 500 = 2 lần."},
{ id:107,topic:"Thanh khoản",type:"Tính toán",q:"Tài sản ngắn hạn 900 tỷ, tồn kho 300 tỷ, nợ ngắn hạn 600 tỷ. Quick ratio bằng bao nhiêu?",a:["0,5 lần","1 lần","1,5 lần","2 lần"],c:1,e:"(900 - 300) / 600 = 1 lần."},
{ id:108,topic:"Thanh khoản",type:"Tính toán",q:"Tiền và tương đương tiền 120 tỷ, đầu tư ngắn hạn đủ điều kiện 30 tỷ, nợ ngắn hạn 300 tỷ. Cash ratio là bao nhiêu?",a:["0,3 lần","0,5 lần","1 lần","2 lần"],c:1,e:"(120 + 30) / 300 = 0,5? Tính đúng: 150 / 300 = 0,5 lần. Đáp án B."},
{ id:109,topic:"Thanh khoản",type:"Tính toán",q:"Tài sản ngắn hạn 750 tỷ, nợ ngắn hạn 900 tỷ. Vốn lưu động ròng là bao nhiêu?",a:["-150 tỷ","150 tỷ","750 tỷ","1.650 tỷ"],c:0,e:"Vốn lưu động ròng = 750 - 900 = -150 tỷ đồng."},
{ id:110,topic:"Thanh khoản",type:"Lý thuyết",q:"Một doanh nghiệp có current ratio cao nhưng quick ratio thấp. Nguyên nhân có thể là gì?",a:["Tỷ trọng hàng tồn kho lớn trong tài sản ngắn hạn","Tiền mặt quá lớn","Không có hàng tồn kho","Nợ dài hạn bằng 0"],c:0,e:"Chênh lệch lớn giữa hai hệ số thường cho thấy hàng tồn kho chiếm tỷ trọng đáng kể."},

{ id:111,topic:"Thanh khoản",type:"Lý thuyết",q:"Khoản phải thu quá hạn kéo dài ảnh hưởng thế nào đến khả năng thanh khoản thực tế?",a:["Làm giảm khả năng chuyển tài sản thành tiền đúng hạn","Luôn làm tăng tiền mặt","Không ảnh hưởng đến thanh khoản","Tự động chuyển thành vốn chủ sở hữu"],c:0,e:"Phải thu khó thu hồi có thể được ghi nhận là tài sản nhưng không tạo tiền để thanh toán nghĩa vụ đúng hạn."},
{ id:112,topic:"Thanh khoản",type:"Lý thuyết",q:"Doanh nghiệp có dòng tiền kinh doanh dương ổn định thường có lợi thế nào?",a:["Có nguồn tiền nội bộ hỗ trợ hoạt động và trả nghĩa vụ","Không cần quản lý công nợ","Không cần vốn lưu động","Không có rủi ro kinh doanh"],c:0,e:"CFO ổn định giúp doanh nghiệp chủ động hơn trong thanh toán, đầu tư và trả nợ."},
{ id:113,topic:"Thanh khoản",type:"Tính toán",q:"Tài sản ngắn hạn 1.200 tỷ, tồn kho 400 tỷ, nợ ngắn hạn 800 tỷ. Quick ratio là bao nhiêu?",a:["0,5 lần","1 lần","1,5 lần","2 lần"],c:1,e:"(1.200 - 400) / 800 = 1 lần."},
{ id:114,topic:"Thanh khoản",type:"Lý thuyết",q:"Doanh nghiệp có tiền mặt thấp nhưng dòng tiền kinh doanh dự kiến thu đều đặn cần được đánh giá thế nào?",a:["Xem lịch thu tiền, lịch trả nợ và khả năng tiếp cận nguồn tài trợ","Kết luận ngay mất khả năng thanh toán","Bỏ qua nợ đến hạn","Chỉ xem lợi nhuận kế toán"],c:0,e:"Thanh khoản phụ thuộc cả số dư tiền hiện tại và thời điểm các dòng tiền vào, ra."},
{ id:115,topic:"Thanh khoản",type:"Lý thuyết",q:"Rủi ro thanh khoản là gì?",a:["Rủi ro không có đủ tiền hoặc tài sản dễ chuyển đổi thành tiền để đáp ứng nghĩa vụ đến hạn","Rủi ro doanh thu tăng","Rủi ro cổ tức tăng","Rủi ro tăng số lượng nhân viên"],c:0,e:"Rủi ro thanh khoản xuất hiện khi doanh nghiệp không thể đáp ứng nghĩa vụ thanh toán đúng hạn mà không chịu tổn thất lớn."},

{ id:116,topic:"Hiệu quả hoạt động",type:"Lý thuyết",q:"Vòng quay tổng tài sản đo lường điều gì?",a:["Khả năng tạo doanh thu từ quy mô tài sản bình quân","Khả năng trả lãi vay","Tỷ lệ cổ tức","Tỷ lệ nợ quá hạn"],c:0,e:"TATO = Doanh thu thuần / Tổng tài sản bình quân."},
{ id:117,topic:"Hiệu quả hoạt động",type:"Lý thuyết",q:"Vòng quay hàng tồn kho thường được tính bằng công thức nào?",a:["Giá vốn hàng bán / Hàng tồn kho bình quân","Doanh thu / Tổng nợ","Lợi nhuận / Vốn chủ sở hữu","Tiền / Nợ ngắn hạn"],c:0,e:"Inventory turnover = Giá vốn hàng bán / Hàng tồn kho bình quân."},
{ id:118,topic:"Hiệu quả hoạt động",type:"Lý thuyết",q:"Số ngày tồn kho bình quân được tính gần đúng như thế nào?",a:["365 / Vòng quay hàng tồn kho","Vòng quay hàng tồn kho / 365","Doanh thu / 365","Tổng tài sản / 365"],c:0,e:"DIO = 365 / Inventory turnover, nếu sử dụng năm 365 ngày."},
{ id:119,topic:"Hiệu quả hoạt động",type:"Lý thuyết",q:"Vòng quay khoản phải thu cao thường phản ánh điều gì?",a:["Doanh nghiệp thu hồi công nợ nhanh hơn tương đối","Khách hàng trả chậm hơn","Hàng tồn kho tăng","Nợ vay dài hạn tăng"],c:0,e:"Vòng quay phải thu cao thường thể hiện tốc độ thu hồi công nợ nhanh, nhưng cần xem chính sách tín dụng bán hàng."},
{ id:120,topic:"Hiệu quả hoạt động",type:"Lý thuyết",q:"DSO là chỉ tiêu phản ánh điều gì?",a:["Số ngày thu tiền bán hàng bình quân","Số ngày thanh toán nợ vay","Số ngày khấu hao tài sản","Số ngày tồn tại doanh nghiệp"],c:0,e:"DSO = 365 / Vòng quay khoản phải thu, phản ánh thời gian thu tiền bình quân."},
{ id:121,topic:"Hiệu quả hoạt động",type:"Tính toán",q:"Doanh thu thuần 2.400 tỷ, tổng tài sản bình quân 1.200 tỷ. Vòng quay tổng tài sản là bao nhiêu?",a:["1 lần","2 lần","2,5 lần","3 lần"],c:1,e:"TATO = 2.400 / 1.200 = 2 lần."},
{ id:122,topic:"Hiệu quả hoạt động",type:"Tính toán",q:"Giá vốn hàng bán 1.800 tỷ, hàng tồn kho bình quân 300 tỷ. Vòng quay hàng tồn kho là bao nhiêu?",a:["3 lần","4 lần","6 lần","8 lần"],c:2,e:"Vòng quay tồn kho = 1.800 / 300 = 6 lần."},
{ id:123,topic:"Hiệu quả hoạt động",type:"Tính toán",q:"Vòng quay hàng tồn kho là 5 lần/năm. Số ngày tồn kho bình quân theo năm 365 ngày là bao nhiêu?",a:["53 ngày","63 ngày","73 ngày","90 ngày"],c:2,e:"DIO = 365 / 5 = 73 ngày."},
{ id:124,topic:"Hiệu quả hoạt động",type:"Tính toán",q:"Doanh thu bán chịu 1.200 tỷ, phải thu bình quân 200 tỷ. Vòng quay phải thu là bao nhiêu?",a:["4 lần","5 lần","6 lần","8 lần"],c:2,e:"Vòng quay phải thu = 1.200 / 200 = 6 lần."},
{ id:125,topic:"Hiệu quả hoạt động",type:"Tính toán",q:"Vòng quay phải thu là 6 lần/năm. DSO theo 360 ngày là bao nhiêu?",a:["30 ngày","45 ngày","60 ngày","90 ngày"],c:2,e:"DSO = 360 / 6 = 60 ngày."},

{ id:126,topic:"Hiệu quả hoạt động",type:"Lý thuyết",q:"Chu kỳ chuyển đổi tiền mặt (CCC) được tính bằng công thức nào?",a:["DIO + DSO - DPO","DIO - DSO + DPO","DIO × DSO × DPO","Doanh thu - Giá vốn"],c:0,e:"CCC = Số ngày tồn kho + Số ngày phải thu - Số ngày phải trả."},
{ id:127,topic:"Hiệu quả hoạt động",type:"Lý thuyết",q:"DPO tăng, các yếu tố khác không đổi, thường làm CCC thay đổi thế nào?",a:["Giảm","Tăng","Không đổi","Luôn bằng 0"],c:0,e:"DPO tăng nghĩa là doanh nghiệp kéo dài thời gian thanh toán nhà cung cấp, làm CCC giảm về mặt công thức."},
{ id:128,topic:"Hiệu quả hoạt động",type:"Lý thuyết",q:"Vòng quay hàng tồn kho giảm liên tục có thể là dấu hiệu nào?",a:["Hàng hóa luân chuyển chậm hoặc tồn kho tăng nhanh hơn giá vốn","Hàng hóa bán nhanh hơn","Doanh thu chắc chắn tăng","Doanh nghiệp không còn tồn kho"],c:0,e:"Cần xem tồn kho chậm luân chuyển, nhu cầu giảm, dự trữ quá mức hoặc thay đổi cơ cấu sản phẩm."},
{ id:129,topic:"Hiệu quả hoạt động",type:"Lý thuyết",q:"Khi tính các chỉ tiêu vòng quay tài sản, tại sao thường sử dụng số dư bình quân?",a:["Vì doanh thu và chi phí phản ánh cả kỳ, còn tài sản là số dư tại thời điểm","Vì số dư cuối kỳ luôn sai","Vì không cần số liệu đầu kỳ","Vì quy định phải dùng số dư nhỏ nhất"],c:0,e:"Sử dụng số dư bình quân giúp phù hợp hơn giữa chỉ tiêu hoạt động trong kỳ và số dư tài sản tại thời điểm."},
{ id:130,topic:"Hiệu quả hoạt động",type:"Lý thuyết",q:"Vòng quay tổng tài sản tăng có luôn là dấu hiệu tốt không?",a:["Không, cần xem doanh nghiệp có bán tài sản, thiếu đầu tư hoặc hoạt động quá công suất hay không","Có, luôn luôn","Có, nếu doanh nghiệp có nợ","Không bao giờ tốt"],c:0,e:"Vòng quay tăng có thể do hiệu quả tốt hơn nhưng cũng có thể do tài sản giảm, thiếu đầu tư hoặc doanh thu tăng bất thường."},

{ id:131,topic:"Hiệu quả hoạt động",type:"Tính toán",q:"DIO 60 ngày, DSO 45 ngày, DPO 30 ngày. Chu kỳ chuyển đổi tiền mặt là bao nhiêu?",a:["45 ngày","60 ngày","75 ngày","135 ngày"],c:2,e:"CCC = 60 + 45 - 30 = 75 ngày."},
{ id:132,topic:"Hiệu quả hoạt động",type:"Tính toán",q:"Doanh thu thuần 3.000 tỷ, tổng tài sản bình quân 1.500 tỷ. TATO bằng bao nhiêu?",a:["1 lần","1,5 lần","2 lần","3 lần"],c:2,e:"3.000 / 1.500 = 2 lần."},
{ id:133,topic:"Hiệu quả hoạt động",type:"Tính toán",q:"Giá vốn 2.400 tỷ, tồn kho bình quân 400 tỷ. Số ngày tồn kho theo năm 360 ngày là bao nhiêu?",a:["45 ngày","60 ngày","75 ngày","90 ngày"],c:1,e:"Vòng quay tồn kho = 2.400 / 400 = 6 lần. DIO = 360 / 6 = 60 ngày."},
{ id:134,topic:"Hiệu quả hoạt động",type:"Tính toán",q:"Doanh thu bán chịu 1.800 tỷ, phải thu bình quân 300 tỷ. DSO theo 360 ngày là bao nhiêu?",a:["30 ngày","45 ngày","60 ngày","90 ngày"],c:2,e:"Vòng quay phải thu = 1.800 / 300 = 6 lần. DSO = 360 / 6 = 60 ngày."},
{ id:135,topic:"Hiệu quả hoạt động",type:"Lý thuyết",q:"Nếu doanh nghiệp giảm thời gian thu tiền khách hàng mà không làm giảm doanh thu, tác động có thể là gì?",a:["Cải thiện vốn lưu động và dòng tiền","Làm tăng DSO","Làm giảm CFO","Tăng tồn kho bắt buộc"],c:0,e:"Thu tiền nhanh giúp giảm vốn bị chiếm dụng trong khoản phải thu và hỗ trợ dòng tiền kinh doanh."},
{ id:136,topic:"Khả năng sinh lời",type:"Lý thuyết",q:"ROA đo lường điều gì?",a:["Khả năng tạo lợi nhuận từ tài sản","Khả năng trả nợ ngắn hạn","Tốc độ thu hồi công nợ","Tỷ lệ cổ tức tiền mặt"],c:0,e:"ROA thường = Lợi nhuận sau thuế / Tổng tài sản bình quân. Cần nhất quán về phạm vi lợi nhuận và tài sản."},
{ id:137,topic:"Khả năng sinh lời",type:"Lý thuyết",q:"ROE đo lường điều gì?",a:["Khả năng tạo lợi nhuận trên vốn chủ sở hữu bình quân","Khả năng tạo doanh thu trên hàng tồn kho","Khả năng thanh toán nợ ngắn hạn","Tỷ trọng tài sản cố định"],c:0,e:"ROE thường = Lợi nhuận sau thuế thuộc về cổ đông thường / Vốn chủ sở hữu bình quân tương ứng."},
{ id:138,topic:"Khả năng sinh lời",type:"Lý thuyết",q:"ROS được tính bằng công thức nào?",a:["Lợi nhuận sau thuế / Doanh thu thuần","Doanh thu thuần / Tổng tài sản","Nợ phải trả / Tổng tài sản","Tiền / Nợ ngắn hạn"],c:0,e:"ROS = Lợi nhuận sau thuế / Doanh thu thuần."},
{ id:139,topic:"Khả năng sinh lời",type:"Lý thuyết",q:"ROE tăng do vốn chủ sở hữu giảm mạnh trong khi lợi nhuận không đổi. Cần lưu ý điều gì?",a:["ROE có thể tăng do hiệu ứng mẫu số, không nhất thiết do hiệu quả kinh doanh tốt hơn","Doanh nghiệp chắc chắn tăng năng suất","Rủi ro tài chính chắc chắn giảm","Doanh thu chắc chắn tăng"],c:0,e:"ROE có thể bị đẩy lên bởi vốn chủ sở hữu giảm, chẳng hạn do lỗ lũy kế hoặc mua lại cổ phiếu; cần phân tích nguyên nhân."},
{ id:140,topic:"Khả năng sinh lời",type:"Tính toán",q:"Lợi nhuận sau thuế 200 tỷ, tổng tài sản bình quân 2.000 tỷ. ROA là bao nhiêu?",a:["5%","10%","15%","20%"],c:1,e:"ROA = 200 / 2.000 × 100% = 10%."},
{ id:141,topic:"Khả năng sinh lời",type:"Tính toán",q:"Lợi nhuận sau thuế 180 tỷ, vốn chủ sở hữu bình quân 900 tỷ. ROE là bao nhiêu?",a:["10%","15%","20%","25%"],c:2,e:"ROE = 180 / 900 × 100% = 20%."},
{ id:142,topic:"Khả năng sinh lời",type:"Tính toán",q:"Lợi nhuận sau thuế 120 tỷ, doanh thu thuần 1.500 tỷ. ROS là bao nhiêu?",a:["6%","8%","10%","12%"],c:1,e:"ROS = 120 / 1.500 × 100% = 8%."},
{ id:143,topic:"Khả năng sinh lời",type:"Tính toán",q:"Doanh thu thuần 2.000 tỷ, giá vốn 1.400 tỷ. Biên lợi nhuận gộp là bao nhiêu?",a:["20%","25%","30%","35%"],c:2,e:"Lợi nhuận gộp = 600 tỷ. Biên gộp = 600 / 2.000 = 30%."},
{ id:144,topic:"Khả năng sinh lời",type:"Lý thuyết",q:"ROA giảm trong khi doanh thu tăng có thể do nguyên nhân nào?",a:["Tài sản tăng nhanh hơn lợi nhuận","Tài sản giảm mạnh","Lợi nhuận tăng nhanh hơn tài sản","Doanh nghiệp không có tài sản"],c:0,e:"Nếu lợi nhuận không tăng tương ứng với tài sản bình quân, ROA có thể giảm."},
{ id:145,topic:"Khả năng sinh lời",type:"Lý thuyết",q:"Biên lợi nhuận ròng giảm có thể xuất phát từ yếu tố nào?",a:["Chi phí hoạt động, chi phí lãi vay hoặc thuế tăng tương đối","Doanh thu chắc chắn giảm về 0","Vốn chủ sở hữu tăng","Tiền mặt tăng"],c:0,e:"ROS chịu tác động của giá vốn, chi phí bán hàng, quản lý, tài chính, thu nhập khác và thuế."},
{ id:146,topic:"Khả năng sinh lời",type:"Lý thuyết",q:"Khi so sánh ROE giữa hai doanh nghiệp, cần lưu ý điều gì?",a:["Khác biệt về đòn bẩy, biên lợi nhuận và vòng quay tài sản","Chỉ so sánh doanh thu","Chỉ so sánh số nhân viên","Không cần xem cơ cấu vốn"],c:0,e:"ROE chịu ảnh hưởng bởi hiệu quả hoạt động và đòn bẩy tài chính; ROE cao không phải lúc nào cũng tốt hơn."},
{ id:147,topic:"Khả năng sinh lời",type:"Tính toán",q:"Lợi nhuận sau thuế 300 tỷ, tài sản đầu kỳ 2.000 tỷ, cuối kỳ 2.500 tỷ. ROA tính theo tài sản bình quân là bao nhiêu?",a:["10%","12%","13,33%","15%"],c:2,e:"Tài sản bình quân = (2.000 + 2.500) / 2 = 2.250 tỷ. ROA = 300 / 2.250 = 13,33%. Đáp án đúng là C."},
{ id:148,topic:"Khả năng sinh lời",type:"Tính toán",q:"Lợi nhuận sau thuế 240 tỷ, vốn chủ sở hữu đầu kỳ 1.000 tỷ, cuối kỳ 1.400 tỷ. ROE theo vốn bình quân là bao nhiêu?",a:["15%","20%","24%","30%"],c:1,e:"Vốn bình quân = 1.200 tỷ. ROE = 240 / 1.200 = 20%."},
{ id:149,topic:"Khả năng sinh lời",type:"Lý thuyết",q:"Lợi nhuận sau thuế tăng nhưng CFO giảm liên tục có thể đặt ra nghi vấn nào?",a:["Chất lượng lợi nhuận và khả năng chuyển lợi nhuận thành tiền","Doanh nghiệp không cần vốn lưu động","Doanh nghiệp không có công nợ","Tất cả doanh thu đều đã thu bằng tiền"],c:0,e:"Cần kiểm tra tăng phải thu, tồn kho, doanh thu ghi nhận sớm, chi phí vốn hóa và các khoản mục bất thường."},
{ id:150,topic:"Khả năng sinh lời",type:"Lý thuyết",q:"Một doanh nghiệp có ROE cao bất thường do vốn chủ sở hữu rất thấp. Nhà phân tích nên làm gì?",a:["Phân tích thêm D/E, lợi nhuận, dòng tiền và chất lượng vốn chủ sở hữu","Kết luận ngay doanh nghiệp tốt nhất ngành","Bỏ qua nợ vay","Chỉ xem cổ tức"],c:0,e:"ROE cần được diễn giải cùng đòn bẩy và mức độ an toàn tài chính; mẫu số vốn chủ sở hữu thấp có thể làm tỷ lệ tăng mạnh."}

,
{ id:151,topic:"Dự báo BCTC",type:"Lý thuyết",q:"Mục tiêu của dự báo báo cáo tài chính doanh nghiệp là gì?",a:["Ước tính tình hình tài chính và kết quả hoạt động trong tương lai dựa trên giả định hợp lý","Chỉ xác định số liệu đã phát sinh","Thay thế báo cáo kiểm toán","Xác định chắc chắn giá cổ phiếu tương lai"],c:0,e:"Dự báo BCTC hỗ trợ lập kế hoạch, đánh giá nhu cầu vốn, khả năng sinh lời và rủi ro tương lai."},
{ id:152,topic:"Dự báo BCTC",type:"Lý thuyết",q:"Phương pháp dự báo theo tỷ lệ phần trăm doanh thu thường dựa trên giả định nào?",a:["Một số khoản mục có quan hệ tương đối ổn định với doanh thu","Mọi khoản mục đều không đổi","Doanh thu luôn bằng lợi nhuận","Nợ phải trả luôn bằng vốn chủ sở hữu"],c:0,e:"Phương pháp này giả định một số khoản mục tài sản, chi phí hoặc nợ hoạt động biến động theo doanh thu."},
{ id:153,topic:"Dự báo BCTC",type:"Lý thuyết",q:"Khoản mục nào thường có thể biến động theo doanh thu trong dự báo?",a:["Một số khoản phải thu, hàng tồn kho và giá vốn","Vốn điều lệ trong mọi trường hợp","Đất đai trong mọi trường hợp","Nợ vay dài hạn luôn cố định theo doanh thu"],c:0,e:"Các khoản mục hoạt động có thể được dự báo dựa trên tỷ lệ lịch sử so với doanh thu, sau khi đánh giá tính phù hợp."},
{ id:154,topic:"Dự báo BCTC",type:"Lý thuyết",q:"Khi dự báo doanh thu, yếu tố nào cần được xem xét?",a:["Tăng trưởng ngành, thị phần, giá bán, sản lượng và năng lực sản xuất","Chỉ số lượng nhân viên kế toán","Chỉ số dư tiền mặt","Chỉ mức cổ tức năm trước"],c:0,e:"Dự báo doanh thu cần căn cứ vào cả yếu tố thị trường và năng lực nội tại của doanh nghiệp."},
{ id:155,topic:"Dự báo BCTC",type:"Lý thuyết",q:"Phân tích độ nhạy trong dự báo dùng để làm gì?",a:["Đánh giá kết quả thay đổi thế nào khi một giả định đầu vào thay đổi","Xác định chính xác mọi biến số tương lai","Thay thế toàn bộ dự báo","Chỉ tính số lượng cổ phiếu"],c:0,e:"Phân tích độ nhạy giúp xác định biến số nào có ảnh hưởng lớn đến kết quả dự báo."},
{ id:156,topic:"Dự báo BCTC",type:"Lý thuyết",q:"Phân tích kịch bản thường xây dựng những trường hợp nào?",a:["Cơ sở, tích cực và tiêu cực","Chỉ một trường hợp duy nhất","Chỉ trường hợp doanh thu bằng 0","Chỉ trường hợp lợi nhuận cao nhất"],c:0,e:"Kịch bản giúp đánh giá kết quả trong các điều kiện kinh doanh khác nhau."},
{ id:157,topic:"Dự báo BCTC",type:"Lý thuyết",q:"Nếu doanh thu dự kiến tăng nhưng doanh nghiệp không có đủ công suất sản xuất, dự báo cần xử lý thế nào?",a:["Xem xét đầu tư bổ sung, thuê ngoài hoặc giới hạn tăng trưởng","Giữ nguyên giả định mà không phân tích","Tự động tăng lợi nhuận","Bỏ qua giới hạn công suất"],c:0,e:"Dự báo phải nhất quán với năng lực vận hành và nhu cầu đầu tư để đạt mức doanh thu dự kiến."},
{ id:158,topic:"Dự báo BCTC",type:"Lý thuyết",q:"Dự báo dòng tiền có ý nghĩa gì?",a:["Đánh giá nhu cầu vốn và khả năng đáp ứng nghĩa vụ thanh toán trong tương lai","Chỉ tính lợi nhuận kế toán","Chỉ xác định vốn điều lệ","Không liên quan đến thanh khoản"],c:0,e:"Dự báo dòng tiền giúp phát hiện thời điểm thiếu hụt tiền, nhu cầu vay vốn và khả năng trả nợ."},
{ id:159,topic:"Dự báo BCTC",type:"Tính toán",q:"Doanh thu hiện tại 1.000 tỷ, dự kiến tăng 10%. Doanh thu dự báo là bao nhiêu?",a:["1.010 tỷ","1.050 tỷ","1.100 tỷ","1.200 tỷ"],c:2,e:"Doanh thu dự báo = 1.000 × (1 + 10%) = 1.100 tỷ."},
{ id:160,topic:"Dự báo BCTC",type:"Tính toán",q:"Giá vốn bằng 70% doanh thu. Doanh thu dự báo 1.200 tỷ. Giá vốn dự báo là bao nhiêu?",a:["700 tỷ","800 tỷ","840 tỷ","900 tỷ"],c:2,e:"Giá vốn dự báo = 1.200 × 70% = 840 tỷ."},

{ id:161,topic:"Dự báo BCTC",type:"Tính toán",q:"Doanh thu dự báo 2.000 tỷ, biên lợi nhuận gộp dự kiến 25%. Lợi nhuận gộp dự báo là bao nhiêu?",a:["250 tỷ","400 tỷ","500 tỷ","600 tỷ"],c:2,e:"Lợi nhuận gộp = 2.000 × 25% = 500 tỷ."},
{ id:162,topic:"Dự báo BCTC",type:"Tính toán",q:"Phải thu khách hàng dự kiến bằng 15% doanh thu. Doanh thu dự báo 1.500 tỷ. Phải thu dự báo là bao nhiêu?",a:["150 tỷ","200 tỷ","225 tỷ","300 tỷ"],c:2,e:"Phải thu dự báo = 1.500 × 15% = 225 tỷ."},
{ id:163,topic:"Dự báo BCTC",type:"Tính toán",q:"Chi phí bán hàng dự kiến bằng 5% doanh thu. Doanh thu 2.400 tỷ. Chi phí bán hàng dự báo là bao nhiêu?",a:["100 tỷ","120 tỷ","140 tỷ","160 tỷ"],c:1,e:"Chi phí bán hàng = 2.400 × 5% = 120 tỷ."},
{ id:164,topic:"Dự báo BCTC",type:"Lý thuyết",q:"Khi dự báo lợi nhuận, nếu chi phí lãi vay tăng mạnh thì yếu tố nào cần được cập nhật?",a:["Cơ cấu nợ, lãi suất, lịch trả nợ và nhu cầu vay mới","Chỉ số lượng sản phẩm","Chỉ số lượng nhân viên","Chỉ doanh thu năm trước"],c:0,e:"Chi phí lãi vay phụ thuộc dư nợ, lãi suất, đồng tiền vay và lịch giải ngân, trả nợ."},
{ id:165,topic:"Dự báo BCTC",type:"Lý thuyết",q:"Một mô hình dự báo tốt cần có đặc điểm nào?",a:["Giả định rõ ràng, nhất quán, có thể kiểm tra và cập nhật","Chỉ cần nhiều công thức phức tạp","Không cần dữ liệu lịch sử","Không cần kiểm tra kết quả"],c:0,e:"Mô hình cần minh bạch giả định, có liên kết giữa các báo cáo và có thể cập nhật khi điều kiện thay đổi."},

{ id:166,topic:"Chất lượng BCTC",type:"Lý thuyết",q:"Chất lượng lợi nhuận thường được đánh giá dựa trên yếu tố nào?",a:["Tính bền vững, khả năng chuyển thành tiền và mức độ phản ánh hoạt động cốt lõi","Chỉ quy mô doanh thu","Chỉ số lượng tài sản cố định","Chỉ mức cổ tức"],c:0,e:"Lợi nhuận chất lượng cao thường có tính lặp lại hợp lý, được hỗ trợ bởi dòng tiền và phản ánh hoạt động kinh doanh thực chất."},
{ id:167,topic:"Chất lượng BCTC",type:"Lý thuyết",q:"Doanh thu tăng mạnh trong khi khoản phải thu tăng nhanh hơn nhiều có thể là dấu hiệu cần kiểm tra nào?",a:["Chính sách bán chịu, khả năng thu tiền và thời điểm ghi nhận doanh thu","Doanh nghiệp chắc chắn thu tiền tốt","Doanh nghiệp không có rủi ro","Doanh nghiệp không cần dự phòng"],c:0,e:"Phải thu tăng nhanh hơn doanh thu có thể phản ánh điều kiện tín dụng nới lỏng hoặc rủi ro ghi nhận doanh thu và thu hồi công nợ."},
{ id:168,topic:"Chất lượng BCTC",type:"Lý thuyết",q:"Lợi nhuận tăng mạnh chủ yếu do hoàn nhập dự phòng cần được đánh giá thế nào?",a:["Xem xét tính chất bất thường và khả năng lặp lại","Coi là tăng trưởng hoạt động cốt lõi","Bỏ qua thuyết minh","Tự động kết luận dòng tiền tăng"],c:0,e:"Hoàn nhập dự phòng có thể làm tăng lợi nhuận kỳ hiện tại nhưng không nhất thiết phản ánh cải thiện hoạt động cốt lõi."},
{ id:169,topic:"Chất lượng BCTC",type:"Lý thuyết",q:"Kiểm toán viên đưa ra ý kiến ngoại trừ có ý nghĩa gì?",a:["Có vấn đề trọng yếu nhưng không lan tỏa đến mức phải đưa ra ý kiến trái ngược hoặc từ chối đưa ý kiến","BCTC chắc chắn hoàn toàn sai","Doanh nghiệp chắc chắn phá sản","Không có vấn đề nào cần quan tâm"],c:0,e:"Ý kiến ngoại trừ cho thấy có sai sót hoặc giới hạn phạm vi kiểm toán trọng yếu nhưng không lan tỏa theo đánh giá của kiểm toán viên."},
{ id:170,topic:"Chất lượng BCTC",type:"Lý thuyết",q:"Ý kiến kiểm toán chấp nhận toàn phần có nghĩa là gì?",a:["BCTC được trình bày trung thực, hợp lý trên các khía cạnh trọng yếu theo khuôn khổ áp dụng","Doanh nghiệp chắc chắn không có gian lận","Doanh nghiệp chắc chắn sinh lời cao","Doanh nghiệp không có rủi ro kinh doanh"],c:0,e:"Ý kiến chấp nhận toàn phần không đảm bảo doanh nghiệp không có gian lận hoặc không có rủi ro trong tương lai."},
{ id:171,topic:"Chất lượng BCTC",type:"Lý thuyết",q:"Giao dịch với bên liên quan cần được chú ý vì sao?",a:["Có thể phát sinh xung đột lợi ích, điều kiện giao dịch không theo thị trường hoặc rủi ro chuyển lợi ích","Luôn làm tăng lợi nhuận","Không cần công bố","Luôn là giao dịch bất hợp pháp"],c:0,e:"Cần xem xét bản chất giao dịch, giá trị, điều kiện, số dư công nợ và mức độ công bố thông tin."},
{ id:172,topic:"Chất lượng BCTC",type:"Lý thuyết",q:"Dấu hiệu nào có thể cho thấy rủi ro ghi nhận doanh thu?",a:["Doanh thu tăng đột biến cuối kỳ, phải thu tăng mạnh và chính sách bán hàng bất thường","Doanh thu ổn định và tiền thu phù hợp","CFO ổn định qua nhiều năm","Thuyết minh đầy đủ và nhất quán"],c:0,e:"Cần kiểm tra thời điểm ghi nhận, điều khoản giao hàng, quyền trả lại hàng và khả năng thu tiền."},
{ id:173,topic:"Chất lượng BCTC",type:"Lý thuyết",q:"Vốn hóa chi phí không phù hợp có thể gây ảnh hưởng gì?",a:["Làm tăng tài sản và lợi nhuận kỳ hiện tại so với ghi nhận chi phí ngay","Luôn làm giảm tài sản","Không ảnh hưởng lợi nhuận","Tự động làm tăng CFO"],c:0,e:"Vốn hóa chi phí sai có thể trì hoãn ghi nhận chi phí, làm lợi nhuận hiện tại cao hơn và tài sản bị ghi nhận cao hơn."},
{ id:174,topic:"Chất lượng BCTC",type:"Lý thuyết",q:"Dự phòng giảm giá hàng tồn kho có vai trò gì?",a:["Phản ánh tổn thất ước tính khi giá trị thuần có thể thực hiện được thấp hơn giá gốc","Làm tăng doanh thu","Làm tăng tiền mặt","Thay thế khấu hao tài sản cố định"],c:0,e:"Dự phòng giúp phản ánh hàng tồn kho theo nguyên tắc thận trọng khi giá trị thuần có thể thực hiện được thấp hơn giá gốc."},
{ id:175,topic:"Chất lượng BCTC",type:"Lý thuyết",q:"Doanh nghiệp thay đổi ước tính thời gian sử dụng hữu ích của tài sản cố định cần được xem xét thế nào?",a:["Đánh giá tính hợp lý, căn cứ thay đổi và ảnh hưởng đến chi phí khấu hao","Bỏ qua vì không ảnh hưởng lợi nhuận","Tự động kết luận gian lận","Chỉ xem doanh thu"],c:0,e:"Thay đổi thời gian sử dụng hữu ích ảnh hưởng mức khấu hao và lợi nhuận; cần kiểm tra căn cứ và thuyết minh."},

{ id:176,topic:"Chất lượng BCTC",type:"Tình huống",q:"Doanh nghiệp báo lãi 500 tỷ nhưng CFO âm 200 tỷ trong hai năm liên tiếp. Bước phân tích phù hợp nhất là gì?",a:["Kiểm tra biến động phải thu, tồn kho, phải trả, doanh thu và các điều chỉnh lợi nhuận","Kết luận ngay doanh nghiệp chắc chắn gian lận","Chỉ xem EPS","Bỏ qua báo cáo lưu chuyển tiền tệ"],c:0,e:"Cần đối chiếu lợi nhuận với dòng tiền, xác định vốn lưu động bị chiếm dụng và kiểm tra các khoản ghi nhận bất thường."},
{ id:177,topic:"Chất lượng BCTC",type:"Tình huống",q:"Doanh thu tăng 40%, phải thu tăng 100%, DSO tăng mạnh. Nhận định nào hợp lý nhất?",a:["Rủi ro thu hồi công nợ tăng, cần kiểm tra chất lượng doanh thu","Chất lượng doanh thu chắc chắn cải thiện","Doanh nghiệp không cần vốn lưu động","Dòng tiền kinh doanh chắc chắn tăng"],c:0,e:"Phải thu và DSO tăng nhanh hơn doanh thu là tín hiệu cần kiểm tra chính sách bán chịu và khả năng thu tiền."},
{ id:178,topic:"Chất lượng BCTC",type:"Tình huống",q:"Lợi nhuận năm nay tăng mạnh do bán một nhà máy. Khi đánh giá khả năng sinh lời dài hạn, nên làm gì?",a:["Tách lợi nhuận thanh lý tài sản khỏi lợi nhuận hoạt động thường xuyên","Dùng toàn bộ lợi nhuận năm nay làm mức lợi nhuận bình thường","Bỏ qua doanh thu","Chỉ xem vốn điều lệ"],c:0,e:"Thu nhập thanh lý tài sản thường không lặp lại nên cần chuẩn hóa lợi nhuận khi dự báo."},
{ id:179,topic:"Chất lượng BCTC",type:"Tình huống",q:"Một doanh nghiệp liên tục thay đổi chính sách ghi nhận doanh thu và ước tính kế toán. Nhà phân tích nên làm gì?",a:["Đọc thuyết minh, đánh giá tác động và điều chỉnh số liệu so sánh nếu có thể","Bỏ qua vì không ảnh hưởng báo cáo","Chỉ xem giá cổ phiếu","Kết luận chắc chắn có gian lận"],c:0,e:"Thay đổi chính sách và ước tính có thể làm giảm tính so sánh và ảnh hưởng chất lượng lợi nhuận."},
{ id:180,topic:"Chất lượng BCTC",type:"Tình huống",q:"Kiểm toán viên nhấn mạnh vấn đề về khả năng hoạt động liên tục. Điều này cần được hiểu thế nào?",a:["Có vấn đề hoặc yếu tố không chắc chắn trọng yếu cần xem xét về khả năng tiếp tục hoạt động","Doanh nghiệp chắc chắn đã phá sản","Doanh nghiệp chắc chắn có lợi nhuận cao","Không liên quan đến nhà đầu tư"],c:0,e:"Đây là cảnh báo quan trọng về khả năng duy trì hoạt động, cần xem xét dòng tiền, nợ đến hạn và kế hoạch tài trợ."},

{ id:181,topic:"Tình huống tổng hợp",type:"Tính toán",q:"Doanh thu thuần 4.000 tỷ, lợi nhuận sau thuế 240 tỷ. ROS là bao nhiêu?",a:["4%","5%","6%","8%"],c:2,e:"ROS = 240 / 4.000 × 100% = 6%."},
{ id:182,topic:"Tình huống tổng hợp",type:"Tính toán",q:"Lợi nhuận sau thuế 300 tỷ, tài sản bình quân 3.000 tỷ, vốn chủ sở hữu bình quân 1.500 tỷ. ROA và ROE lần lượt là bao nhiêu?",a:["10% và 20%","20% và 10%","15% và 30%","5% và 10%"],c:0,e:"ROA = 300 / 3.000 = 10%. ROE = 300 / 1.500 = 20%."},
{ id:183,topic:"Tình huống tổng hợp",type:"Tính toán",q:"Doanh thu thuần 2.500 tỷ, tổng tài sản bình quân 1.250 tỷ, lợi nhuận sau thuế 125 tỷ. ROS và TATO lần lượt là bao nhiêu?",a:["5% và 2 lần","10% và 2 lần","5% và 1 lần","10% và 1 lần"],c:0,e:"ROS = 125 / 2.500 = 5%. TATO = 2.500 / 1.250 = 2 lần."},
{ id:184,topic:"Tình huống tổng hợp",type:"Tính toán",q:"ROS là 5%, vòng quay tổng tài sản là 2 lần, hệ số nhân vốn chủ sở hữu là 2 lần. ROE theo Dupont ba nhân tố là bao nhiêu?",a:["10%","15%","20%","25%"],c:2,e:"ROE = ROS × TATO × Equity multiplier = 5% × 2 × 2 = 20%."},
{ id:185,topic:"Tình huống tổng hợp",type:"Lý thuyết",q:"Mô hình Dupont ba nhân tố phân tích ROE thành những yếu tố nào?",a:["Biên lợi nhuận ròng × Vòng quay tổng tài sản × Hệ số nhân vốn chủ sở hữu","Doanh thu × Chi phí × Thuế","Tiền × Nợ × Hàng tồn kho","ROA × ROS × EPS"],c:0,e:"Dupont giúp xác định ROE chịu ảnh hưởng từ biên lợi nhuận, hiệu quả sử dụng tài sản và đòn bẩy tài chính."},
{ id:186,topic:"Tình huống tổng hợp",type:"Tình huống",q:"Doanh nghiệp A có ROE 25%, D/E 3 lần; doanh nghiệp B có ROE 18%, D/E 0,5 lần. Kết luận nào hợp lý?",a:["A chắc chắn tốt hơn B","B chắc chắn tốt hơn A","Cần phân tích thêm rủi ro đòn bẩy, dòng tiền và hiệu quả hoạt động trước khi kết luận","Không thể sử dụng ROE"],c:2,e:"ROE cao của A có thể được khuếch đại bởi đòn bẩy. Cần đánh giá khả năng trả nợ và tính bền vững lợi nhuận."},
{ id:187,topic:"Tình huống tổng hợp",type:"Tình huống",q:"Một doanh nghiệp có current ratio 2,5 lần nhưng phần lớn tài sản ngắn hạn là hàng tồn kho chậm luân chuyển. Nhận định nào phù hợp?",a:["Thanh khoản thực tế có thể yếu hơn chỉ số hiện hành thể hiện","Doanh nghiệp chắc chắn thanh khoản rất tốt","Không cần xem quick ratio","Doanh nghiệp không có rủi ro"],c:0,e:"Hàng tồn kho chậm luân chuyển không dễ chuyển thành tiền; cần xem quick ratio, tuổi tồn kho và giá trị có thể thu hồi."},
{ id:188,topic:"Tình huống tổng hợp",type:"Tình huống",q:"Doanh nghiệp có CFO dương, dòng tiền đầu tư âm lớn và dòng tiền tài chính dương. Cách diễn giải nào hợp lý?",a:["Có thể doanh nghiệp tạo tiền từ kinh doanh, đang đầu tư và huy động vốn để tài trợ","Chắc chắn doanh nghiệp đang phá sản","Chắc chắn không có hoạt động kinh doanh","Chắc chắn không có nợ"],c:0,e:"Cần đọc từng dòng tiền: CFO phản ánh tạo tiền, CFI âm có thể do đầu tư, CFF dương có thể do huy động vốn."},
{ id:189,topic:"Tình huống tổng hợp",type:"Tình huống",q:"Doanh nghiệp có lợi nhuận tăng, ROA tăng, CFO dương ổn định và nợ vay giảm. Nhận định nào hợp lý nhất?",a:["Các dấu hiệu nhìn chung cho thấy hiệu quả và sức khỏe tài chính cải thiện, nhưng vẫn cần kiểm tra chất lượng lợi nhuận","Doanh nghiệp chắc chắn không có rủi ro","Doanh nghiệp chắc chắn tăng giá cổ phiếu","Không cần đọc thuyết minh"],c:0,e:"Các chỉ tiêu tích cực hỗ trợ đánh giá nhưng không loại trừ rủi ro ngành, thị trường, kế toán và triển vọng."},
{ id:190,topic:"Tình huống tổng hợp",type:"Tình huống",q:"Doanh nghiệp có doanh thu giảm, tồn kho tăng, DSO tăng và CFO âm. Nhóm rủi ro nào đáng chú ý nhất?",a:["Suy giảm tiêu thụ và vốn lưu động bị ứ đọng","Hiệu quả thu tiền chắc chắn cải thiện","Khả năng thanh khoản chắc chắn tăng","Không có vấn đề gì"],c:0,e:"Doanh thu giảm cùng tồn kho, phải thu và CFO bất lợi có thể cho thấy hàng hóa khó tiêu thụ và tiền bị chiếm dụng."},

{ id:191,topic:"Tình huống tổng hợp",type:"Tính toán",q:"Doanh thu thuần 3.000 tỷ, lợi nhuận sau thuế 180 tỷ, tài sản bình quân 1.500 tỷ, vốn chủ sở hữu bình quân 900 tỷ. ROS, ROA, ROE lần lượt là bao nhiêu?",a:["6%, 12%, 20%","6%, 10%, 20%","8%, 12%, 18%","10%, 15%, 20%"],c:0,e:"ROS = 180/3.000 = 6%. ROA = 180/1.500 = 12%. ROE = 180/900 = 20%."},
{ id:192,topic:"Tình huống tổng hợp",type:"Tính toán",q:"Tài sản ngắn hạn 1.500 tỷ, hàng tồn kho 500 tỷ, tiền và tương đương tiền 200 tỷ, nợ ngắn hạn 1.000 tỷ. Current ratio và quick ratio lần lượt là bao nhiêu?",a:["1,5 và 1,0 lần","1,0 và 1,5 lần","2,0 và 1,5 lần","1,5 và 0,5 lần"],c:0,e:"Current ratio = 1.500/1.000 = 1,5. Quick ratio = (1.500 - 500)/1.000 = 1,0 lần."},
{ id:193,topic:"Tình huống tổng hợp",type:"Tính toán",q:"Tổng tài sản 5.000 tỷ, nợ phải trả 3.000 tỷ, vốn chủ sở hữu 2.000 tỷ. Debt ratio và D/E lần lượt là bao nhiêu?",a:["60% và 1,5 lần","40% và 1,5 lần","60% và 2 lần","50% và 1 lần"],c:0,e:"Debt ratio = 3.000/5.000 = 60%. D/E = 3.000/2.000 = 1,5 lần."},
{ id:194,topic:"Tình huống tổng hợp",type:"Tính toán",q:"DIO 50 ngày, DSO 40 ngày, DPO 35 ngày. CCC là bao nhiêu?",a:["45 ngày","55 ngày","75 ngày","125 ngày"],c:1,e:"CCC = 50 + 40 - 35 = 55 ngày."},
{ id:195,topic:"Tình huống tổng hợp",type:"Tình huống",q:"Doanh nghiệp có ROE tăng từ 15% lên 25%, trong khi ROA giảm và D/E tăng mạnh. Nguyên nhân có khả năng là gì?",a:["Đòn bẩy tài chính tăng làm ROE được khuếch đại","Hiệu quả tài sản chắc chắn tăng","Doanh nghiệp giảm nợ mạnh","Doanh thu chắc chắn tăng"],c:0,e:"ROE tăng trong khi ROA giảm và D/E tăng cho thấy đòn bẩy có thể là yếu tố chính làm ROE tăng."},
{ id:196,topic:"Tình huống tổng hợp",type:"Tình huống",q:"Doanh nghiệp có lợi nhuận sau thuế cao nhưng thường xuyên phải vay ngắn hạn để trả nợ đến hạn. Cần ưu tiên phân tích điều gì?",a:["Dòng tiền hoạt động, vốn lưu động và lịch đáo hạn nợ","Chỉ biên lợi nhuận gộp","Chỉ số lượng nhân viên","Chỉ giá trị thương hiệu"],c:0,e:"Lợi nhuận kế toán không đồng nghĩa có tiền. Cần đánh giá khả năng chuyển lợi nhuận thành tiền và cơ cấu kỳ hạn nợ."},
{ id:197,topic:"Tình huống tổng hợp",type:"Tình huống",q:"Doanh nghiệp có doanh thu tăng nhanh nhưng biên lợi nhuận gộp giảm liên tục. Cần kiểm tra yếu tố nào?",a:["Giá bán, giá vốn, cơ cấu sản phẩm và chi phí đầu vào","Chỉ số lượng cổ đông","Chỉ số dư tiền gửi","Chỉ vốn điều lệ"],c:0,e:"Biên gộp giảm có thể do cạnh tranh giá, nguyên liệu tăng, cơ cấu sản phẩm thay đổi hoặc hiệu quả sản xuất suy giảm."},
{ id:198,topic:"Tình huống tổng hợp",type:"Tình huống",q:"Khi định giá hoặc đánh giá doanh nghiệp, vì sao cần chuẩn hóa lợi nhuận?",a:["Loại trừ hoặc điều chỉnh các khoản bất thường để phản ánh khả năng sinh lời bền vững","Để làm lợi nhuận luôn cao hơn","Để bỏ qua mọi chi phí","Để thay thế báo cáo kiểm toán"],c:0,e:"Lợi nhuận chuẩn hóa giúp tránh dự báo dựa trên các khoản thu nhập hoặc chi phí không lặp lại."},
{ id:199,topic:"Tình huống tổng hợp",type:"Lý thuyết",q:"Thứ tự phân tích hợp lý khi đánh giá một doanh nghiệp là gì?",a:["Hiểu ngành và mô hình kinh doanh, phân tích BCTC, đánh giá chỉ tiêu, chất lượng lợi nhuận và triển vọng","Chỉ nhìn EPS rồi kết luận","Chỉ xem doanh thu rồi kết luận","Chỉ xem giá cổ phiếu"],c:0,e:"Cần kết hợp bối cảnh ngành, mô hình kinh doanh, báo cáo, chỉ tiêu, chất lượng số liệu và triển vọng."},
{ id:200,topic:"Tình huống tổng hợp",type:"Tình huống",q:"Khi đưa ra kết luận cuối cùng về sức khỏe tài chính doanh nghiệp, cách tiếp cận nào phù hợp nhất?",a:["Kết hợp khả năng thanh toán, cơ cấu vốn, hiệu quả hoạt động, sinh lời, dòng tiền và chất lượng BCTC","Chỉ căn cứ vào lợi nhuận sau thuế","Chỉ căn cứ vào tổng tài sản","Chỉ căn cứ vào tỷ lệ nợ"],c:0,e:"Không có một chỉ tiêu đơn lẻ nào phản ánh đầy đủ sức khỏe tài chính. Cần phân tích tổng hợp và so sánh theo thời gian, ngành."},

// =====================================================
// 60 BÀI TẬP THỰC TẾ - PHÂN TÍCH BÁO CÁO TÀI CHÍNH
// Cấu trúc tương thích: q, a, c, e
// c = vị trí đáp án đúng, bắt đầu từ 0
// =====================================================

{
  q: "Bài 1. Doanh nghiệp A có tài sản ngắn hạn 600 tỷ đồng và nợ ngắn hạn 400 tỷ đồng. Hệ số thanh toán hiện hành là bao nhiêu?",
  a: ["0,67 lần", "1,5 lần", "2 lần", "2,5 lần"],
  c: 1,
  e: "Công thức: Hệ số thanh toán hiện hành = Tài sản ngắn hạn / Nợ ngắn hạn. Thay số: 600 / 400 = 1,5 lần. Nghĩa là cứ 1 đồng nợ ngắn hạn, doanh nghiệp có 1,5 đồng tài sản ngắn hạn để đảm bảo. Chỉ tiêu cao thường thể hiện khả năng thanh toán ngắn hạn tốt hơn, nhưng cần xem xét chất lượng hàng tồn kho và khoản phải thu."
},
{
  q: "Bài 2. Doanh nghiệp B có tài sản ngắn hạn 500 tỷ, hàng tồn kho 200 tỷ và nợ ngắn hạn 400 tỷ. Hệ số thanh toán nhanh là bao nhiêu? Giả sử không có tài sản ngắn hạn kém thanh khoản nào khác cần loại trừ.",
  a: ["0,5 lần", "0,75 lần", "1 lần", "1,25 lần"],
  c: 1,
  e: "Công thức đơn giản: Hệ số thanh toán nhanh = (Tài sản ngắn hạn - Hàng tồn kho) / Nợ ngắn hạn. Thay số: (500 - 200) / 400 = 0,75 lần. Chỉ tiêu này loại trừ hàng tồn kho do hàng tồn kho thường cần thời gian để bán và chuyển thành tiền. Hệ số dưới 1 cho thấy tài sản có tính thanh khoản cao chưa đủ bù đắp toàn bộ nợ ngắn hạn."
},
{
  q: "Bài 3. Tổng tài sản của doanh nghiệp là 2.000 tỷ đồng, trong đó tài sản ngắn hạn là 600 tỷ đồng. Tỷ trọng tài sản ngắn hạn trong tổng tài sản là bao nhiêu?",
  a: ["20%", "25%", "30%", "35%"],
  c: 2,
  e: "Tỷ trọng tài sản ngắn hạn = Tài sản ngắn hạn / Tổng tài sản × 100%. Thay số: 600 / 2.000 × 100% = 30%. Điều này cho thấy 30% tài sản của doanh nghiệp nằm ở nhóm tài sản ngắn hạn; 70% còn lại là tài sản dài hạn. Cần so sánh với đặc điểm ngành nghề để đánh giá cơ cấu này có hợp lý hay không."
},
{
  q: "Bài 4. Doanh nghiệp có nợ phải trả 900 tỷ đồng và tổng nguồn vốn 1.500 tỷ đồng. Tỷ trọng nợ phải trả là bao nhiêu?",
  a: ["40%", "50%", "60%", "70%"],
  c: 2,
  e: "Tỷ trọng nợ phải trả = Nợ phải trả / Tổng nguồn vốn × 100%. Thay số: 900 / 1.500 × 100% = 60%. Doanh nghiệp tài trợ 60% tổng nguồn vốn bằng nợ và 40% bằng vốn chủ sở hữu. Tỷ lệ nợ cao làm tăng áp lực trả lãi, trả gốc và rủi ro tài chính."
},
{
  q: "Bài 5. Doanh nghiệp có tài sản ngắn hạn 500 tỷ đồng và nợ ngắn hạn 300 tỷ đồng. Vốn lưu động ròng là bao nhiêu?",
  a: ["100 tỷ đồng", "150 tỷ đồng", "200 tỷ đồng", "250 tỷ đồng"],
  c: 2,
  e: "Vốn lưu động ròng = Tài sản ngắn hạn - Nợ ngắn hạn. Thay số: 500 - 300 = 200 tỷ đồng. Vốn lưu động ròng dương cho thấy một phần tài sản ngắn hạn được tài trợ bằng nguồn vốn dài hạn. Tuy nhiên, cần xem xét khả năng thu hồi công nợ và chuyển đổi hàng tồn kho thành tiền."
},
{
  q: "Bài 6. Doanh nghiệp có nợ phải trả 800 tỷ đồng và vốn chủ sở hữu 600 tỷ đồng. Tổng tài sản theo phương trình kế toán là bao nhiêu?",
  a: ["1.200 tỷ đồng", "1.400 tỷ đồng", "1.600 tỷ đồng", "1.800 tỷ đồng"],
  c: 1,
  e: "Theo phương trình kế toán: Tổng tài sản = Nợ phải trả + Vốn chủ sở hữu. Thay số: 800 + 600 = 1.400 tỷ đồng. Đây là nguyên tắc cân bằng cơ bản của bảng cân đối kế toán. Tổng tài sản luôn bằng tổng nguồn vốn."
},
{
  q: "Bài 7. Doanh nghiệp có doanh thu thuần 1.000 tỷ đồng và lợi nhuận sau thuế 150 tỷ đồng. Tỷ suất lợi nhuận trên doanh thu (ROS) là bao nhiêu?",
  a: ["10%", "12%", "15%", "20%"],
  c: 2,
  e: "ROS = Lợi nhuận sau thuế / Doanh thu thuần × 100%. Thay số: 150 / 1.000 × 100% = 15%. Nghĩa là cứ 100 đồng doanh thu thuần tạo ra 15 đồng lợi nhuận sau thuế. ROS tăng có thể phản ánh biên lợi nhuận tốt hơn, nhưng cần phân tích nguyên nhân từ giá bán, giá vốn và chi phí."
},
{
  q: "Bài 8. Doanh nghiệp có lợi nhuận sau thuế 150 tỷ đồng, tổng tài sản đầu kỳ 1.000 tỷ và cuối kỳ 1.250 tỷ. ROA tính theo tổng tài sản bình quân là bao nhiêu?",
  a: ["10%", "12%", "13,33%", "15%"],
  c: 2,
  e: "Tổng tài sản bình quân = (1.000 + 1.250) / 2 = 1.125 tỷ đồng. ROA = Lợi nhuận sau thuế / Tổng tài sản bình quân × 100% = 150 / 1.125 × 100% = 13,33%. ROA phản ánh khả năng tạo lợi nhuận từ tài sản bình quân mà doanh nghiệp sử dụng."
},
{
  q: "Bài 9. Doanh nghiệp có lợi nhuận sau thuế 150 tỷ đồng, vốn chủ sở hữu đầu kỳ 600 tỷ và cuối kỳ 900 tỷ. ROE là bao nhiêu?",
  a: ["15%", "18%", "20%", "25%"],
  c: 2,
  e: "Vốn chủ sở hữu bình quân = (600 + 900) / 2 = 750 tỷ đồng. ROE = Lợi nhuận sau thuế / Vốn chủ sở hữu bình quân × 100% = 150 / 750 × 100% = 20%. Chỉ tiêu cho biết mỗi 100 đồng vốn chủ sở hữu bình quân tạo ra 20 đồng lợi nhuận sau thuế."
},
{
  q: "Bài 10. Giá vốn hàng bán trong năm là 300 tỷ đồng. Hàng tồn kho đầu kỳ 100 tỷ và cuối kỳ 200 tỷ. Vòng quay hàng tồn kho là bao nhiêu?",
  a: ["1,5 vòng", "2 vòng", "2,5 vòng", "3 vòng"],
  c: 1,
  e: "Hàng tồn kho bình quân = (100 + 200) / 2 = 150 tỷ đồng. Vòng quay hàng tồn kho = Giá vốn hàng bán / Hàng tồn kho bình quân = 300 / 150 = 2 vòng. Nghĩa là hàng tồn kho bình quân luân chuyển khoảng 2 vòng trong năm. Vòng quay thấp có thể phản ánh tồn kho chậm luân chuyển hoặc tích trữ hàng quá mức."
},
{
  q: "Bài 11. Doanh nghiệp có tiền và tương đương tiền 120 tỷ đồng, đầu tư tài chính ngắn hạn có tính thanh khoản cao 30 tỷ đồng, nợ ngắn hạn 300 tỷ đồng. Hệ số thanh toán tức thời theo cách tính gồm tiền và tương đương tiền là bao nhiêu?",
  a: ["0,3 lần", "0,4 lần", "0,5 lần", "0,6 lần"],
  c: 0,

},
{
  q: "Bài 12. Tài sản ngắn hạn của doanh nghiệp tăng từ 400 tỷ lên 520 tỷ đồng. Tốc độ tăng tài sản ngắn hạn là bao nhiêu?",
  a: ["20%", "25%", "30%", "35%"],
  c: 2,
  e: "Tốc độ tăng = (Giá trị cuối kỳ - Giá trị đầu kỳ) / Giá trị đầu kỳ × 100%. Thay số: (520 - 400) / 400 × 100% = 30%. Tài sản ngắn hạn tăng 30%. Cần tìm hiểu tăng do tiền, khoản phải thu hay hàng tồn kho để đánh giá chất lượng tăng trưởng."
},
{
  q: "Bài 13. Doanh thu thuần của doanh nghiệp tăng từ 800 tỷ lên 1.000 tỷ đồng. Tốc độ tăng doanh thu là bao nhiêu?",
  a: ["20%", "22,5%", "25%", "30%"],
  c: 2,
  e: "Tốc độ tăng doanh thu = (1.000 - 800) / 800 × 100% = 25%. Doanh thu tăng 25% so với kỳ trước. Tuy nhiên, tăng doanh thu chưa chắc đồng nghĩa tăng lợi nhuận; cần xem xét giá vốn, chi phí bán hàng và quản lý."
},
{
  q: "Bài 14. Doanh thu thuần là 1.200 tỷ đồng, giá vốn hàng bán là 840 tỷ đồng. Tỷ suất lợi nhuận gộp trên doanh thu là bao nhiêu?",
  a: ["20%", "25%", "30%", "35%"],
  c: 2,
  e: "Lợi nhuận gộp = Doanh thu thuần - Giá vốn hàng bán = 1.200 - 840 = 360 tỷ đồng. Biên lợi nhuận gộp = 360 / 1.200 × 100% = 30%. Chỉ tiêu phản ánh phần doanh thu còn lại sau khi trừ giá vốn, trước chi phí bán hàng, quản lý và các chi phí khác."
},
{
  q: "Bài 15. Doanh nghiệp có lợi nhuận gộp 360 tỷ đồng, chi phí bán hàng 100 tỷ, chi phí quản lý doanh nghiệp 80 tỷ và doanh thu hoạt động tài chính 20 tỷ. Bỏ qua các khoản chi phí và thu nhập khác, lợi nhuận trước lãi vay và thuế (EBIT) là bao nhiêu?",
  a: ["180 tỷ", "200 tỷ", "220 tỷ", "240 tỷ"],
  c: 1,
  e: "EBIT theo dữ liệu đề bài = Lợi nhuận gộp - Chi phí bán hàng - Chi phí quản lý + Doanh thu tài chính (giả sử doanh thu tài chính thuộc hoạt động được tính vào kết quả trước lãi vay và thuế) = 360 - 100 - 80 + 20 = 200 tỷ đồng. Khi phân tích thực tế, cần phân loại chính xác doanh thu tài chính và chi phí tài chính theo báo cáo."
},
{
  q: "Bài 16. Doanh nghiệp có lợi nhuận trước thuế 200 tỷ đồng và chi phí thuế thu nhập doanh nghiệp 40 tỷ đồng. Lợi nhuận sau thuế là bao nhiêu?",
  a: ["140 tỷ", "150 tỷ", "160 tỷ", "180 tỷ"],
  c: 2,
  e: "Lợi nhuận sau thuế = Lợi nhuận trước thuế - Chi phí thuế thu nhập doanh nghiệp = 200 - 40 = 160 tỷ đồng. Đây là phần lợi nhuận còn lại sau khi ghi nhận chi phí thuế thu nhập doanh nghiệp."
},
{
  q: "Bài 17. Doanh nghiệp có lợi nhuận sau thuế 90 tỷ đồng và doanh thu thuần 900 tỷ đồng. ROS là bao nhiêu?",
  a: ["8%", "9%", "10%", "12%"],
  c: 2,
  e: "ROS = 90 / 900 × 100% = 10%. Cứ 100 đồng doanh thu thuần, doanh nghiệp tạo ra 10 đồng lợi nhuận sau thuế. Nếu ROS giảm qua các năm, cần xem xét giá vốn tăng, chi phí hoạt động tăng hoặc doanh nghiệp giảm giá bán."
},
{
  q: "Bài 18. Doanh thu thuần tăng 20% nhưng lợi nhuận sau thuế chỉ tăng 5%. Nhận định nào phù hợp nhất?",
  a: ["Hiệu quả sinh lời trên doanh thu có thể suy giảm", "ROS chắc chắn tăng", "Chi phí chắc chắn giảm", "Doanh nghiệp chắc chắn không có nợ"],
  c: 0,
  e: "Khi doanh thu tăng nhanh hơn lợi nhuận sau thuế, biên lợi nhuận có xu hướng giảm nếu các điều kiện so sánh tương đương. Có thể do giá vốn, chi phí bán hàng, quản lý, lãi vay hoặc thuế tăng nhanh. Không thể kết luận chắc chắn chỉ từ hai tốc độ tăng trưởng mà không xem số liệu gốc."
},
{
  q: "Bài 19. Doanh nghiệp có lợi nhuận sau thuế 120 tỷ đồng và tổng tài sản bình quân 1.000 tỷ đồng. ROA là bao nhiêu?",
  a: ["10%", "12%", "15%", "20%"],
  c: 1,
  e: "ROA = Lợi nhuận sau thuế / Tổng tài sản bình quân × 100% = 120 / 1.000 × 100% = 12%. Chỉ tiêu cho biết mỗi 100 đồng tài sản bình quân tạo ra 12 đồng lợi nhuận sau thuế."
},
{
  q: "Bài 20. Lợi nhuận sau thuế là 100 tỷ đồng. Vốn chủ sở hữu đầu kỳ 400 tỷ và cuối kỳ 600 tỷ. ROE theo vốn chủ sở hữu bình quân là bao nhiêu?",
  a: ["15%", "18%", "20%", "25%"],
  c: 2,
  e: "Vốn chủ sở hữu bình quân = (400 + 600) / 2 = 500 tỷ đồng. ROE = 100 / 500 × 100% = 20%. Cần dùng vốn chủ sở hữu bình quân khi lợi nhuận được tạo ra trong cả kỳ, thay vì chỉ dùng số cuối kỳ."
},
{
  q: "Bài 21. Doanh nghiệp có doanh thu thuần 1.000 tỷ đồng và khoản phải thu bình quân 200 tỷ đồng. Vòng quay khoản phải thu là bao nhiêu? Giả sử toàn bộ doanh thu là bán chịu.",
  a: ["4 vòng", "5 vòng", "6 vòng", "8 vòng"],
  c: 1,
  e: "Vòng quay khoản phải thu = Doanh thu bán chịu / Khoản phải thu bình quân = 1.000 / 200 = 5 vòng. Doanh nghiệp thu hồi khoản phải thu bình quân khoảng 5 lần trong năm. Nếu doanh thu có phần bán tiền ngay thì nên dùng doanh thu bán chịu để tính chính xác."
},
{
  q: "Bài 22. Vòng quay khoản phải thu của doanh nghiệp là 6 vòng/năm. Số ngày thu tiền bình quân theo quy ước 360 ngày là bao nhiêu?",
  a: ["45 ngày", "50 ngày", "60 ngày", "90 ngày"],
  c: 2,

},
{
  q: "Bài 23. Giá vốn hàng bán là 720 tỷ đồng, hàng tồn kho bình quân 120 tỷ đồng. Vòng quay hàng tồn kho là bao nhiêu?",
  a: ["4 vòng", "5 vòng", "6 vòng", "8 vòng"],
  c: 2,
  e: "Vòng quay hàng tồn kho = Giá vốn hàng bán / Hàng tồn kho bình quân = 720 / 120 = 6 vòng. Chỉ tiêu phản ánh tốc độ luân chuyển hàng tồn kho. Nên so sánh với doanh nghiệp cùng ngành và các kỳ trước."
},
{
  q: "Bài 24. Vòng quay hàng tồn kho là 4 vòng/năm. Số ngày tồn kho bình quân theo quy ước 360 ngày là bao nhiêu?",
  a: ["60 ngày", "75 ngày", "90 ngày", "120 ngày"],

},
{
  q: "Bài 25. Doanh thu thuần là 1.500 tỷ đồng và tổng tài sản bình quân là 750 tỷ đồng. Vòng quay tổng tài sản là bao nhiêu?",
  a: ["1 vòng", "1,5 vòng", "2 vòng", "2,5 vòng"],

},
{
  q: "Bài 26. Doanh nghiệp có doanh thu thuần 1.000 tỷ đồng và tài sản cố định bình quân 250 tỷ đồng. Vòng quay tài sản cố định là bao nhiêu?",
  a: ["2 vòng", "3 vòng", "4 vòng", "5 vòng"],

},
{
  q: "Bài 27. Doanh nghiệp có tổng nợ phải trả 600 tỷ đồng và vốn chủ sở hữu 400 tỷ đồng. Hệ số nợ trên vốn chủ sở hữu (D/E) là bao nhiêu?",
  a: ["0,5 lần", "1 lần", "1,5 lần", "2 lần"],

},
{
  q: "Bài 28. Tổng tài sản của doanh nghiệp là 2.000 tỷ đồng, nợ phải trả là 1.200 tỷ đồng. Tỷ lệ vốn chủ sở hữu trên tổng tài sản là bao nhiêu?",
  a: ["30%", "35%", "40%", "60%"],
  c: 2,
  e: "Vốn chủ sở hữu = Tổng tài sản - Nợ phải trả = 2.000 - 1.200 = 800 tỷ đồng. Tỷ lệ vốn chủ sở hữu = 800 / 2.000 × 100% = 40%. Doanh nghiệp tài trợ 40% tài sản bằng vốn chủ sở hữu."
},
{
  q: "Bài 29. Doanh nghiệp có EBIT 300 tỷ đồng và chi phí lãi vay 60 tỷ đồng. Hệ số khả năng thanh toán lãi vay là bao nhiêu?",
  a: ["3 lần", "4 lần", "5 lần", "6 lần"],
  c: 2,
  e: "Hệ số khả năng thanh toán lãi vay = EBIT / Chi phí lãi vay = 300 / 60 = 5 lần. EBIT gấp 5 lần chi phí lãi vay, cho thấy lợi nhuận hoạt động có khả năng trang trải chi phí lãi vay tương đối tốt. Nếu hệ số thấp hoặc giảm liên tục, rủi ro tài chính có thể tăng."
},
{
  q: "Bài 30. Nợ phải trả của doanh nghiệp là 900 tỷ đồng, tổng tài sản là 1.500 tỷ đồng. Hệ số nợ trên tổng tài sản là bao nhiêu?",
  a: ["40%", "50%", "60%", "70%"],
  c: 2,
  e: "Hệ số nợ = Nợ phải trả / Tổng tài sản × 100% = 900 / 1.500 × 100% = 60%. Có 60% tài sản được tài trợ bằng nợ phải trả. Cần đánh giá thêm khả năng sinh lời, dòng tiền và thời hạn nợ."
},
{
  q: "Bài 31. Doanh nghiệp có tổng nợ phải trả 800 tỷ đồng, trong đó nợ ngắn hạn 300 tỷ đồng. Tỷ trọng nợ ngắn hạn trong tổng nợ phải trả là bao nhiêu?",
  a: ["25%", "30%", "37,5%", "40%"],
  c: 2,
  e: "Tỷ trọng nợ ngắn hạn = 300 / 800 × 100% = 37,5%. Phần nợ ngắn hạn chiếm 37,5% tổng nợ phải trả. Nợ ngắn hạn cao có thể tạo áp lực thanh toán trong thời gian gần."
},
{
  q: "Bài 32. Doanh nghiệp có EBIT 240 tỷ đồng, chi phí lãi vay 80 tỷ đồng. Nếu EBIT giảm 25% và chi phí lãi vay không đổi, hệ số thanh toán lãi vay mới là bao nhiêu?",
  a: ["1,5 lần", "2 lần", "2,25 lần", "3 lần"],
  c: 1,
  e: "EBIT mới = 240 × (1 - 25%) = 180 tỷ đồng. Hệ số thanh toán lãi vay mới = 180 / 80 = 2,25 lần. Đáp án đúng là C. Hệ số giảm từ 3 lần xuống 2,25 lần, cho thấy biên an toàn trả lãi vay suy giảm. (Sửa đáp án đúng: c = 2)."
},
{
  q: "Bài 33. Báo cáo lưu chuyển tiền tệ của doanh nghiệp cho thấy lưu chuyển tiền thuần từ hoạt động kinh doanh (CFO) là 150 tỷ đồng, từ hoạt động đầu tư là -100 tỷ đồng và từ hoạt động tài chính là -30 tỷ đồng. Lưu chuyển tiền thuần trong kỳ là bao nhiêu?",
  a: ["10 tỷ", "20 tỷ", "30 tỷ", "50 tỷ"],

  e: "Lưu chuyển tiền thuần trong kỳ = CFO + Lưu chuyển tiền từ hoạt động đầu tư + Lưu chuyển tiền từ hoạt động tài chính = 150 - 100 - 30 = 20 tỷ đồng. Đáp án đúng là B. Doanh nghiệp tạo tiền từ hoạt động kinh doanh, đồng thời chi tiền đầu tư và trả nợ hoặc phân phối vốn. (Sửa đáp án đúng: c = 1)."
},
{
  q: "Bài 34. Doanh nghiệp có lợi nhuận sau thuế 100 tỷ đồng nhưng CFO âm 40 tỷ đồng. Nhận định nào cần được quan tâm nhất?",
  a: ["Doanh nghiệp chắc chắn phá sản", "Chất lượng lợi nhuận cần được kiểm tra vì lợi nhuận chưa chuyển hóa thành tiền", "Doanh nghiệp chắc chắn không có doanh thu", "CFO âm luôn là dấu hiệu tích cực"],
  c: 1,
  e: "Lợi nhuận kế toán và dòng tiền kinh doanh có thể khác nhau do doanh thu chưa thu tiền, khoản phải thu tăng, tồn kho tăng hoặc thanh toán cho nhà cung cấp. CFO âm trong khi lợi nhuận dương là dấu hiệu cần phân tích sâu, nhưng không đủ để kết luận doanh nghiệp phá sản. Cần kiểm tra biến động vốn lưu động và các khoản điều chỉnh."
},
{
  q: "Bài 35. CFO là 200 tỷ đồng và chi mua sắm tài sản cố định (CAPEX) là 120 tỷ đồng. Dòng tiền tự do đơn giản (FCF = CFO - CAPEX) là bao nhiêu?",
  a: ["60 tỷ", "80 tỷ", "100 tỷ", "120 tỷ"],

},
{
  q: "Bài 36. CFO của doanh nghiệp trong ba năm lần lượt là 100 tỷ, 130 tỷ và 160 tỷ đồng. Nhận định nào phù hợp nhất?",

let mode="all",topic="Tất cả",current=0,exam=false,examQuestions=[];
let answers=JSON.parse(localStorage.getItem("bctc_answers")||"{}");
let bookmarks=JSON.parse(localStorage.getItem("bctc_bookmarks")||"[]");

function save(){
 localStorage.setItem("bctc_answers",JSON.stringify(answers));
 localStorage.setItem("bctc_bookmarks",JSON.stringify(bookmarks));
 updateStats();
}
function updateStats(){
 const done=Object.keys(answers).length;
 const right=Object.values(answers).filter(x=>x.correct).length;
 document.getElementById("total").textContent=questions.length;
 document.getElementById("done").textContent=done;
 document.getElementById("right").textContent=right;
 document.getElementById("rate").textContent=done?Math.round(right/done*100)+"%":"0%";
 const p=questions.length?Math.round(done/questions.length*100):0;
 document.getElementById("progressText").textContent=p+"%";
 document.getElementById("progressBar").style.width=p+"%";
}
function getFiltered(){
 let list=exam?examQuestions:questions;
 if(!exam){
  if(topic!=="Tất cả")list=list.filter(q=>q.topic===topic);
  if(mode==="unanswered")list=list.filter(q=>!answers[q.id]);
  if(mode==="wrong")list=list.filter(q=>answers[q.id]&&!answers[q.id].correct);
  if(mode==="bookmarked")list=list.filter(q=>bookmarks.includes(q.id));
 }
 const s=document.getElementById("search").value.toLowerCase();
 if(s)list=list.filter(q=>q.q.toLowerCase().includes(s));
 if(document.getElementById("sort").value==="random"&&!exam)list=[...list].sort(()=>Math.random()-.5);
 return list;
}
function renderTopics(){
 const topics=["Tất cả",...new Set(questions.map(q=>q.topic))];
 document.getElementById("topicList").innerHTML=topics.map(t=>
 `<button class="${topic===t?'active':''}" onclick="setTopic('${t}')">${t}</button>`
 ).join("");
}
function setTopic(t){topic=t;mode="all";exam=false;current=0;renderTopics();render()}
function setMode(m,el){
 mode=m;topic="Tất cả";exam=false;current=0;
 document.querySelectorAll(".sidebar button").forEach(b=>b.classList.remove("active"));
 el.classList.add("active");renderTopics();render();
}
function render(){
 const list=getFiltered();
 if(current>=list.length)current=0;
 const area=document.getElementById("questionArea");
 if(!list.length){area.innerHTML="<div class='panel'>Không có câu hỏi phù hợp.</div>";return}
 const q=list[current];
 const saved=answers[q.id];
 area.innerHTML=`
 <div class="question">
  <div class="qtop">
   <span>Câu ${q.id} / ${questions.length} · ${q.topic}</span>
   <span class="tag">${q.type}</span>
  </div>
  <div class="qtext">${q.q}</div>
  ${q.a.map((a,i)=>`
   <button class="option ${saved?(i===q.c?'correct':(i===saved.choice?'wrong':'')):''}"
    onclick="choose(${q.id},${i})" ${saved?'disabled':''}>
    ${String.fromCharCode(65+i)}. ${a}
   </button>`).join("")}
  <div class="explain ${saved?'show':''}" id="explain">
   <b>${saved?(saved.correct?'Chính xác!':'Chưa chính xác!'):'Giải thích'}</b><br>
   Đáp án: <b>${String.fromCharCode(65+q.c)}</b>. ${q.a[q.c]}<br>
   ${q.e}
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
   <button class="action" onclick="toggleBookmark(${q.id})">
    ${bookmarks.includes(q.id)?'★ Đã đánh dấu':'☆ Đánh dấu'}
   </button>
   <button class="action" onclick="showAnswer(${q.id})">Xem đáp án</button>
  </div>
 </div>
 <div style="color:var(--muted);font-size:13px;text-align:center">
  ${current+1} / ${list.length} câu trong danh sách hiện tại
 </div>`;
 document.getElementById("examInfo").classList.toggle("hidden",!exam);
 if(exam)document.getElementById("examInfo").innerHTML=
 `<b>Chế độ thi thử:</b> ${current+1}/${examQuestions.length} câu. Chọn đáp án để ghi nhận kết quả.`;
}
function choose(id,i){
 const q=questions.find(x=>x.id===id);
 if(answers[id])return;
 answers[id]={choice:i,correct:i===q.c};
 save();render();
}
function showAnswer(id){
 const q=questions.find(x=>x.id===id);
 const box=document.getElementById("explain");
 box.classList.add("show");
 box.innerHTML=`<b>Đáp án: ${String.fromCharCode(65+q.c)}. ${q.a[q.c]}</b><br>${q.e}`;
}
function toggleBookmark(id){
 bookmarks=bookmarks.includes(id)?bookmarks.filter(x=>x!==id):[...bookmarks,id];
 save();render();
}
function nextQuestion(){
 const list=getFiltered();if(current<list.length-1)current++;render();
}
function previousQuestion(){if(current>0)current--;render()}
function startExam(){
 exam=true;mode="all";topic="Tất cả";current=0;
 examQuestions=[...questions].sort(()=>Math.random()-.5).slice(0,Math.min(50,questions.length));
 renderTopics();render();
}
function resetProgress(){
 if(confirm("Bạn có chắc muốn xóa toàn bộ lịch sử làm bài?")){
  answers={};bookmarks=[];save();render();
 }
}
renderTopics();updateStats();render();
</script>
</body>
</html>
